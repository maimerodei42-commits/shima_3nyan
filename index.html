<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>しまねこトリオ旅マップ 🐾</title>

<!-- Web App Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="しまねこトリオ">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background-color: #f0f8ff;
    margin: 0; padding: 0; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); width: 100%; z-index: 1; }
  #ui-layer { position: absolute; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); z-index: 1000; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding-top: var(--sat); }
  .pointer-events-auto { pointer-events: auto; }
  .pale-map-tiles { filter: brightness(1.02) contrast(0.98); }

  #timeline-panel { position: fixed; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); z-index: 1500; background-color: #f8fafc; padding-top: var(--sat); transition: opacity 0.2s ease, visibility 0.2s ease; }
  .timeline-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .timeline-visible { opacity: 1; visibility: visible; pointer-events: auto; }
  #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; padding-bottom: var(--sab); }

  /* ピンのスタイル */
  .custom-pin { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: white; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.25); border: 2px solid white; }
  .pin-done { background-color: #f472b6 !important; border-color: #fbcfe8 !important; opacity: 0.9; } 
  .pin-cancel { background-color: #cbd5e1 !important; opacity: 0.4; text-decoration: line-through; }

  /* 現在地マーカーのパルスアニメーション */
  .user-location-dot {
    width: 18px;
    height: 18px;
    background-color: #0284c7;
    border: 3px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(2, 132, 199, 0.8);
    position: relative;
  }
  .user-location-dot::after {
    content: "";
    position: absolute;
    top: -7px;
    left: -7px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background-color: rgba(14, 165, 233, 0.35);
    animation: pulseRing 1.8s infinite ease-out;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.7); opacity: 0.9; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
</style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col select-none">

<!-- タイトル画面 & メンバー選択 -->
<div id="splashScreen" class="fixed inset-0 z-[9999] bg-gradient-to-b from-slate-100 via-sky-50 to-blue-100 flex flex-col items-center justify-center p-6 text-center">
  <div class="absolute top-10 left-8 text-4xl animate-bounce" style="animation-duration: 3s;">🦪</div>
  <div class="absolute top-1/4 right-10 text-4xl animate-bounce" style="animation-duration: 2.5s;">🍋</div>
  <div class="absolute bottom-20 left-12 text-4xl animate-bounce" style="animation-duration: 3.5s;">🥞</div>
  <div class="absolute bottom-1/3 right-12 text-3xl opacity-60">❄️</div>
  <div class="absolute top-1/3 left-1/4 text-2xl opacity-40">❄️</div>

  <div id="splashTitle" class="space-y-4 animate-fade-in">
    <div class="inline-block bg-white/80 backdrop-blur-md px-6 py-4 rounded-3xl shadow-xl border border-sky-100">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-sky-600 tracking-wider">
        🐾 しまねこトリオ 🐾
      </h1>
      <p class="text-xs text-sky-400 mt-2 font-bold">しまなみ・広島 冬の旅マップ 🍋</p>
    </div>
  </div>

  <div id="userSelectBox" class="hidden space-y-5 animate-fade-in max-w-xs w-full bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-sky-100">
    <h2 class="text-lg font-bold text-slate-700 border-b border-sky-100 pb-2">あなたはだれ？</h2>
    <div class="flex flex-col gap-3">
      <button onclick="selectUser('ありねこ')" class="w-full py-3 bg-rose-400 hover:bg-rose-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
        🐱 ありねこ
      </button>
      <button onclick="selectUser('ことみねこ')" class="w-full py-3 bg-teal-400 hover:bg-teal-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
        🐱 ことみねこ
      </button>
      <button onclick="selectUser('あつきねこ')" class="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
        🐱 あつきねこ
      </button>
    </div>
  </div>
</div>

<div id="map"></div>

<!-- UIレイヤー -->
<div id="ui-layer">
  <div class="p-3 space-y-2 pointer-events-auto w-full box-border">
    <header class="bg-white/90 backdrop-blur-md border-b border-sky-100 shadow-sm rounded-2xl px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🍋</span>
        <h1 class="text-base font-extrabold text-sky-600 m-0">しまねこトリオ 🐾</h1>
        <span id="currentUserBadge" class="text-[10px] bg-sky-100 text-sky-700 font-bold px-2 py-0.5 rounded-full">未選択</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnSearchToggle" onclick="toggleSearch()" class="w-8 h-8 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center border border-sky-100 active:scale-95 transition">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <button onclick="openAddModal()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm transition flex items-center gap-1">
          <i data-lucide="plus-circle" class="w-4 h-4"></i><span>予定の追加</span>
        </button>
      </div>
    </header>

    <!-- グルメカウンター -->
    <div class="bg-white/90 backdrop-blur shadow-sm rounded-xl p-2 flex gap-3 overflow-x-auto hide-scrollbar border border-orange-100">
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🥞</span><span class="text-xs font-bold text-slate-600">お好み焼き</span><span id="cnt-okonomi" class="font-bold text-orange-500 ml-1 text-base">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🦪</span><span class="text-xs font-bold text-slate-600">牡蠣</span><span id="cnt-oyster" class="font-bold text-orange-500 ml-1 text-base">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🍁</span><span class="text-xs font-bold text-slate-600">もみじ饅頭</span><span id="cnt-momiji" class="font-bold text-orange-500 ml-1 text-base">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🍜</span><span class="text-xs font-bold text-slate-600">尾道ラーメン</span><span id="cnt-ramen" class="font-bold text-orange-500 ml-1 text-base">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🍋</span><span class="text-xs font-bold text-slate-600">レモン</span><span id="cnt-lemon" class="font-bold text-orange-500 ml-1 text-base">0</span></div>
    </div>

    <!-- 検索ボックス -->
    <div id="searchContainer" class="hidden flex flex-col gap-1 shadow-lg rounded-xl overflow-hidden bg-white border border-sky-100">
      <div class="flex">
        <input type="text" id="searchInput" placeholder="地名や施設を検索..." class="flex-1 p-2.5 text-xs outline-none">
        <button onclick="executeSearch()" class="bg-sky-500 text-white px-4 flex items-center justify-center"><i data-lucide="search" class="w-4 h-4"></i></button>
      </div>
      <ul id="searchResults" class="text-xs divide-y divide-slate-100 bg-white max-h-48 overflow-y-auto"></ul>
    </div>
  </div>

  <!-- マップ左下：表示中のルート日付バッジ & 右下：操作ボタン -->
  <div class="p-4 flex items-end justify-between pointer-events-none pb-4 w-full box-border">
    <div class="bg-white/95 backdrop-blur px-3 py-1.5 rounded-full shadow-md border border-sky-100 text-[11px] font-bold text-sky-700 pointer-events-auto flex items-center gap-1.5">
      <span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block"></span>
      <span id="mapRouteLabel">11/30 のルート表示中</span>
    </div>
    <div class="flex flex-col items-end gap-3 pointer-events-auto">
      <button onclick="resetToDefaultBounds()" class="bg-white/95 p-3 rounded-full shadow-lg text-slate-600"><i data-lucide="home" class="w-5 h-5"></i></button>
      <button onclick="locateUser()" id="btnLocateUser" class="bg-white/95 p-3 rounded-full shadow-lg text-sky-600"><i data-lucide="locate-fixed" class="w-5 h-5"></i></button>
    </div>
  </div>
</div>

<!-- タイムラインパネル -->
<div id="timeline-panel" class="flex flex-col timeline-hidden border-t border-slate-200">
  <div class="p-4 bg-white shadow-sm z-10 shrink-0">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h2 class="font-bold text-sky-700 text-base m-0 flex items-center gap-1.5"><i data-lucide="route" class="w-5 h-5"></i>📍 旅のみちのり順</h2>
        <p class="text-[10px] text-slate-400 m-0">11/30 〜 12/03 の予定タイムライン</p>
      </div>
    </div>
    <div class="flex gap-2 overflow-x-auto hide-scrollbar" id="tabContainer">
      <button onclick="filterDay('11/30')" class="tab-btn flex-1 bg-sky-500 text-white rounded-lg py-1.5 text-xs font-bold shrink-0" data-day="11/30">11/30 (月)</button>
      <button onclick="filterDay('12/01')" class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold shrink-0" data-day="12/01">12/01 (火)</button>
      <button onclick="filterDay('12/02')" class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold shrink-0" data-day="12/02">12/02 (水)</button>
      <button onclick="filterDay('12/03')" class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold shrink-0" data-day="12/03">12/03 (木)</button>
    </div>
  </div>
  <div id="routeTimelineList" class="p-4 overflow-y-auto flex-1 space-y-2 pb-12 scroll-smooth"></div>
</div>

<nav id="bottom-nav" class="bg-white shadow-[0_-2px_15px_rgba(0,0,0,0.05)] border-t border-sky-100 flex pointer-events-auto">
  <button onclick="switchMainTab('map')" id="navBtnMap" class="flex-1 py-2.5 flex flex-col items-center gap-0.5 text-sky-600 font-bold text-xs"><i data-lucide="map" class="w-5 h-5"></i>マップ</button>
  <button onclick="switchMainTab('route')" id="navBtnRoute" class="flex-1 py-2.5 flex flex-col items-center gap-0.5 text-slate-400 font-bold text-xs"><i data-lucide="route" class="w-5 h-5"></i>みちのり</button>
</nav>

<!-- 追加/編集 モーダル -->
<div id="spotModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[3000] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-5 relative max-h-[85vh] overflow-y-auto border border-sky-100">
    <button type="button" onclick="closeAddModal()" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
    <h3 id="modalTitle" class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="map-pin" class="w-5 h-5 text-sky-500"></i>場所を追加</h3>
    
    <form id="spotForm" onsubmit="saveSpot(event)" class="space-y-3 text-xs">
      <input type="hidden" id="editSpotId">
      <input type="hidden" id="spotLat">
      <input type="hidden" id="spotLng">

      <div>
        <label class="block font-bold text-slate-600 mb-1">スポット名 <span class="text-rose-500">*</span></label>
        <input type="text" id="spotName" required class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-bold text-slate-600 mb-1">ジャンル</label>
          <select id="spotGenre" onchange="autoSetEmoji()" class="w-full border rounded-xl p-2.5 bg-white">
            <option value="sightseeing">🚴 観光・遊び</option>
            <option value="gourmet">🦪 グルメ・ご飯</option>
            <option value="hotel">🏨 宿・休憩</option>
            <option value="other">📍 その他</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">ピンの絵文字</label>
          <input type="text" id="spotEmoji" value="🚴" class="w-full border rounded-xl p-2.5 text-center text-lg outline-none focus:ring-2 focus:ring-sky-400">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div><label class="block font-bold text-slate-600 mb-1">日付</label><select id="spotDate" required class="w-full border rounded-xl p-2.5 bg-white"><option value="11/30">11/30 (月)</option><option value="12/01">12/01 (火)</option><option value="12/02">12/02 (水)</option><option value="12/03">12/03 (木)</option></select></div>
        <div><label class="block font-bold text-slate-600 mb-1">時間</label><select id="spotTime" required class="w-full border rounded-xl p-2.5 bg-white"></select></div>
      </div>

      <!-- 写真添付エリア -->
      <div class="bg-sky-50/70 p-2.5 rounded-xl border border-sky-100">
        <label class="block font-bold text-sky-700 mb-1.5 flex items-center gap-1">
          <i data-lucide="camera" class="w-3.5 h-3.5"></i> 写真を貼り付ける (自動圧縮)
        </label>
        <input type="file" id="spotPhotoInput" accept="image/*" class="w-full text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-sky-500 file:text-white">
        <div id="photoPreviewBox" class="mt-2 hidden relative">
          <img id="photoPreview" class="rounded-xl max-h-36 object-cover w-full border border-sky-200">
          <button type="button" onclick="clearPhoto()" class="absolute top-1.5 right-1.5 bg-slate-900/70 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">✕ 写真を消す</button>
        </div>
      </div>

      <div id="urlContainer" class="space-y-2">
        <label class="block font-bold text-slate-600 mb-1">参考URL (入力すると追加枠が出ます)</label>
        <input type="url" class="spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400" placeholder="https://..." oninput="checkAndAddUrlInput()">
      </div>

      <div>
        <label class="block font-bold text-slate-600 mb-1">優先度</label>
        <select id="spotPriority" class="w-full border rounded-xl p-2.5 bg-white">
          <option value="reserved">✅ 予約済み</option>
          <option value="3">★★★ (絶対行きたい)</option>
          <option value="2">★★☆ (行けたら行く)</option>
          <option value="1">★☆☆ (時間あれば)</option>
        </select>
      </div>

      <div>
        <label class="block font-bold text-slate-600 mb-1">メモ</label>
        <textarea id="spotComment" rows="2" placeholder="おすすめメニューやメモを残せます" class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400"></textarea>
      </div>

      <div class="pt-2 flex gap-2">
        <button type="button" onclick="closeAddModal()" class="w-1/3 py-2.5 rounded-xl border text-slate-600">キャンセル</button>
        <button type="submit" id="btnSaveSpot" class="w-2/3 py-2.5 rounded-xl bg-sky-500 text-white font-bold">保存する</button>
      </div>
    </form>
  </div>
</div>

<!-- 駅選択（発車駅・到着駅）モーダル -->
<div id="stationModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[3000] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-5 relative border border-purple-100">
    <button type="button" onclick="closeStationModal()" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
    <h3 class="text-base font-bold text-purple-700 mb-1 flex items-center gap-1.5">🚃 発車駅・到着駅を選択</h3>
    <p class="text-[11px] text-slate-500 mb-3">この区間は線路の上のみにルート線を引きます。</p>
    
    <form onsubmit="saveStationRoute(event)" class="space-y-3 text-xs">
      <input type="hidden" id="stationSpotId">
      
      <!-- 発車駅 -->
      <div class="bg-purple-50/70 p-3 rounded-2xl border border-purple-100 space-y-1.5">
        <label class="block font-bold text-purple-800">🚉 発車駅</label>
        <div class="flex gap-1.5">
          <input type="text" id="depStationInput" placeholder="例: 広島駅、尾道駅..." class="flex-1 border border-purple-200 rounded-xl p-2 bg-white outline-none focus:ring-2 focus:ring-purple-400">
          <button type="button" onclick="searchStation('dep')" class="bg-purple-600 text-white px-3 rounded-xl font-bold shrink-0">検索</button>
        </div>
        <ul id="depStationResults" class="divide-y divide-purple-100 bg-white rounded-xl max-h-28 overflow-y-auto text-[11px] shadow-xs"></ul>
        <p id="depStationSelectedLabel" class="text-[11px] font-bold text-emerald-600 hidden"></p>
        <input type="hidden" id="depStationLat">
        <input type="hidden" id="depStationLng">
        <input type="hidden" id="depStationName">
      </div>

      <!-- 到着駅 -->
      <div class="bg-purple-50/70 p-3 rounded-2xl border border-purple-100 space-y-1.5">
        <label class="block font-bold text-purple-800">🏁 到着駅</label>
        <div class="flex gap-1.5">
          <input type="text" id="arrStationInput" placeholder="例: 宮島口駅、今治駅..." class="flex-1 border border-purple-200 rounded-xl p-2 bg-white outline-none focus:ring-2 focus:ring-purple-400">
          <button type="button" onclick="searchStation('arr')" class="bg-purple-600 text-white px-3 rounded-xl font-bold shrink-0">検索</button>
        </div>
        <ul id="arrStationResults" class="divide-y divide-purple-100 bg-white rounded-xl max-h-28 overflow-y-auto text-[11px] shadow-xs"></ul>
        <p id="arrStationSelectedLabel" class="text-[11px] font-bold text-emerald-600 hidden"></p>
        <input type="hidden" id="arrStationLat">
        <input type="hidden" id="arrStationLng">
        <input type="hidden" id="arrStationName">
      </div>

      <div class="flex gap-2 pt-1">
        <button type="button" onclick="closeStationModal()" class="w-1/3 py-2.5 rounded-xl border text-slate-600">キャンセル</button>
        <button type="submit" id="btnSaveStation" class="w-2/3 py-2.5 rounded-xl bg-purple-600 text-white font-bold shadow-sm">線路ルートを確定</button>
      </div>
    </form>
  </div>
</div>

<!-- 評価＆カウンター モーダル -->
<div id="evalModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[3000] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl max-w-xs w-full p-5 relative">
    <h3 class="text-base font-bold text-slate-800 mb-1 text-center">⭐ 思い出とグルメ記録</h3>
    <p id="evalUserBadge" class="text-[11px] text-center text-sky-600 font-bold mb-1"></p>
    <p id="evalEditNotice" class="text-[10px] text-center text-pink-500 font-bold mb-3 hidden">※ 前回の記録を読み込みました（更新・削除できます）</p>

    <form onsubmit="submitEvaluation(event)" class="space-y-3 text-xs">
      <input type="hidden" id="evalSpotId">
      
      <div class="bg-orange-50 p-3 rounded-xl border border-orange-100">
        <label class="block font-bold text-orange-700 mb-2">🥞 食べたものを記録 (何個食べた？)</label>
        <div class="flex gap-2">
          <select id="evalFoodType" class="flex-1 border border-orange-200 rounded-lg p-2 bg-white text-slate-700">
            <option value="">-- 食べなかった --</option>
            <option value="okonomi">🥞 お好み焼き</option>
            <option value="oyster">🦪 牡蠣</option>
            <option value="momiji">🍁 もみじ饅頭</option>
            <option value="ramen">🍜 尾道ラーメン</option>
            <option value="lemon">🍋 広島レモン</option>
          </select>
          <select id="evalFoodCount" class="w-20 border border-orange-200 rounded-lg p-2 bg-white text-center font-bold">
            <option value="1">1個</option>
            <option value="2">2個</option>
            <option value="3">3個</option>
            <option value="4">4個</option>
            <option value="5">5個</option>
          </select>
        </div>

      localStorage.setItem(storageKey, JSON.stringify(cacheObj));

  // 現在地の常時同期を開始し、青い円とマーカーを更新
  function startUserLocationTracking() {
    if (!navigator.geolocation || !window.map) return;

    if (window.userWatchId !== null) {

    window.userWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const latlng = [lat, lng];

        if (!window.userLocationCircle) {
          window.userLocationCircle = L.circle(latlng, {
            radius: accuracy,

          window.userLocationCircle.setLatLng(latlng);

        if (!window.userLocationMarker) {
          const userIcon = L.divIcon({
            html: `<div class="user-location-dot"></div>`,
            className: '',
            iconSize: [18, 18],

          window.userLocationMarker.bindPopup(`<div class="text-xs font-bold text-sky-700">📍 ${window.currentUser || 'あなた'}の現在地</div>`);

      () => {},

  function calcStraightDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function formatDistance(meters) {
    if (meters < 1000) return `${Math.round(meters)} m`;
    return `${(meters / 1000).toFixed(1)} km`;
  }

  function formatDuration(seconds, mode) {
    let adjSeconds = seconds;
    if (mode === 'bike') adjSeconds = seconds * 2.2;
    if (mode === 'walk') adjSeconds = seconds * 6.5;

    const mins = Math.round(adjSeconds / 60);
    if (mins < 60) return `約 ${Math.max(1, mins)}分`;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `約 ${h}時間${m > 0 ? m + '分' : ''}`;
  }

  // OpenStreetMap (Overpass API) から発車駅〜到着駅間の実際の線路上ルートを高速取得
  async function fetchRailwayGeometry(depStation, arrStation) {
    const cacheKey = `${depStation.lat.toFixed(4)},${depStation.lng.toFixed(4)}_${arrStation.lat.toFixed(4)},${arrStation.lng.toFixed(4)}`;
    if (window.railCache[cacheKey]) return window.railCache[cacheKey];

    const dist = calcStraightDistance(depStation.lat, depStation.lng, arrStation.lat, arrStation.lng);
    if (dist > 150000) {
      const fallback = { coords: [[depStation.lat, depStation.lng], [arrStation.lat, arrStation.lng]], distance: dist, isRail: false };
      window.railCache[cacheKey] = fallback;
      saveCache("shimaneko_rail_cache_v1", window.railCache);
      return fallback;
    }

    const pad = 0.04;
    const minLat = Math.min(depStation.lat, arrStation.lat) - pad;
    const maxLat = Math.max(depStation.lat, arrStation.lat) + pad;
    const minLng = Math.min(depStation.lng, arrStation.lng) - pad;
    const maxLng = Math.max(depStation.lng, arrStation.lng) + pad;

    const query = `[out:json][timeout:6];way["railway"~"rail|subway|light_rail|tram"](${minLat},${minLng},${maxLat},${maxLng});out geom;`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6500);

    try {
      const res = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: query,
        signal: controller.signal
      });
      clearTimeout(timer);
      const data = await res.json();
      if (data.elements && data.elements.length > 0) {
        const adj = new Map();
        const nodeCoords = new Map();
        const keyOf = (lat, lon) => `${lat.toFixed(5)},${lon.toFixed(5)}`;

        data.elements.forEach(way => {
          if (!way.geometry || way.geometry.length < 2) return;
          for (let i = 0; i < way.geometry.length; i++) {
            const pt = way.geometry[i];
            const k = keyOf(pt.lat, pt.lon);
            nodeCoords.set(k, [pt.lat, pt.lon]);
            if (!adj.has(k)) adj.set(k, []);
            if (i > 0) {
              const prev = way.geometry[i - 1];
              const pk = keyOf(prev.lat, prev.lon);
              const w = calcStraightDistance(pt.lat, pt.lon, prev.lat, prev.lon);
              adj.get(k).push({ to: pk, w });
              adj.get(pk).push({ to: k, w });
            }
          }
        });

        let startKey = null, endKey = null;
        let minStartD = Infinity, minEndD = Infinity;
        nodeCoords.forEach(([lat, lon], k) => {
          const d1 = calcStraightDistance(depStation.lat, depStation.lng, lat, lon);
          if (d1 < minStartD) { minStartD = d1; startKey = k; }
          const d2 = calcStraightDistance(arrStation.lat, arrStation.lng, lat, lon);
          if (d2 < minEndD) { minEndD = d2; endKey = k; }
        });

        if (startKey && endKey && minStartD < 2500 && minEndD < 2500) {
          const distMap = new Map();
          const prevMap = new Map();
          const visited = new Set();
          distMap.set(startKey, 0);

          while (true) {
            let u = null, best = Infinity;
            distMap.forEach((d, k) => {
              if (!visited.has(k) && d < best) { best = d; u = k; }
            });
            if (!u || u === endKey) break;
            visited.add(u);

            const neighbors = adj.get(u) || [];
            for (const edge of neighbors) {
              if (visited.has(edge.to)) continue;
              const alt = best + edge.w;
              if (alt < (distMap.get(edge.to) ?? Infinity)) {
                distMap.set(edge.to, alt);
                prevMap.set(edge.to, u);
              }
            }
          }

          if (prevMap.has(endKey) || startKey === endKey) {
            const path = [];
            let curr = endKey;
            while (curr) {
              path.unshift(nodeCoords.get(curr));
              curr = prevMap.get(curr);
            }
            let totalDist = 0;
            for (let i = 0; i < path.length - 1; i++) {
              totalDist += calcStraightDistance(path[i][0], path[i][1], path[i+1][0], path[i+1][1]);
            }
            const result = { coords: path, distance: totalDist, isRail: true };
            window.railCache[cacheKey] = result;
            saveCache("shimaneko_rail_cache_v1", window.railCache);
            return result;
          }
        }
      }
    } catch (e) {
      clearTimeout(timer);
    }

    const fallback = { coords: [[depStation.lat, depStation.lng], [arrStation.lat, arrStation.lng]], distance: dist, isRail: false };
    window.railCache[cacheKey] = fallback;
    return fallback;
  }

  async function fetchRouteSegment(spotA, spotB) {
    const mode = spotA.transportToNext || 'car';
    const cacheKey = `${spotA.lat.toFixed(5)},${spotA.lng.toFixed(5)}_${spotB.lat.toFixed(5)},${spotB.lng.toFixed(5)}_${mode}`;
    
    if (window.routeCache[cacheKey]) {
      return window.routeCache[cacheKey];
    }

    if (mode === 'plane') {
      const dist = calcStraightDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
      const res = {
        coords: [[spotA.lat, spotA.lng], [spotB.lat, spotB.lng]],
        distance: dist,
        duration: null,
        isStraight: true,
        mode: mode
      };
      window.routeCache[cacheKey] = res;
      saveCache("shimaneko_route_cache_v1", window.routeCache);
      return res;
    }

    const profile = mode === 'walk' ? 'foot' : (mode === 'bike' ? 'bike' : 'driving');
    const url = `https://router.project-osrm.org/route/v1/${profile}/${spotA.lng},${spotA.lat};${spotB.lng},${spotB.lat}?overview=simplified&geometries=geojson`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);

    try {
      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      const data = await response.json();
      if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        const result = {
          coords: coords,
          distance: route.distance,
          duration: route.duration,
          isStraight: false,
          mode: mode
        };
        window.routeCache[cacheKey] = result;
        saveCache("shimaneko_route_cache_v1", window.routeCache);
        return result;
      }
    } catch (e) {
      clearTimeout(timer);
    }

    const dist = calcStraightDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
    return {
      coords: [[spotA.lat, spotA.lng], [spotB.lat, spotB.lng]],
      distance: dist,
      duration: null,
      isStraight: true,
      mode: mode
    };
  }

  // 全区間を並列（Promise.all）で高速取得・描画し、矢印なしで表示
  async function drawMapRoutesAndUpdateDistances(daySpots) {
    if (!window.map) return;

    const currentToken = ++window.routeRenderToken;
    document.getElementById('mapRouteLabel').textContent = `${window.currentDayTab} のルート表示中`;

    const activeSpots = daySpots.filter(s => s.status !== 'cancel');

    const segmentPromises = [];
    for (let i = 0; i < activeSpots.length - 1; i++) {
      const spotA = activeSpots[i];
      const spotB = activeSpots[i + 1];
      const mode = spotA.transportToNext || '';

      if (mode === 'train') {
        if (spotA.trainRoute && spotA.trainRoute.dep && spotA.trainRoute.arr) {
          segmentPromises.push(
            fetchRailwayGeometry(spotA.trainRoute.dep, spotA.trainRoute.arr).then(railSeg => ({
              type: 'train_ready',
              spotA,
              dep: spotA.trainRoute.dep,
              arr: spotA.trainRoute.arr,
              railSeg
            }))
          );
        } else {
          segmentPromises.push(Promise.resolve({ type: 'train_unset', spotA }));
        }
      } else {
        segmentPromises.push(
          fetchRouteSegment(spotA, spotB).then(segment => ({
            type: 'normal',
            spotA,
            mode,
            segment
          }))
        );
      }
    }

    const results = await Promise.all(segmentPromises);

    // 途中で別の日付に切り替えられた場合は古い描画を破棄
    if (currentToken !== window.routeRenderToken) return;

    window.routeLayers.forEach(layer => window.map.removeLayer(layer));
    window.routeLayers = [];

    for (const item of results) {
      const badgeEl = document.getElementById(`dist-badge-${item.spotA.id}`);

      if (item.type === 'train_ready') {
        const lineRail = L.polyline(item.railSeg.coords, {
          color: '#8b5cf6',
          weight: 5,
          opacity: 0.9,
          lineJoin: 'round'
        }).addTo(window.map);
        window.routeLayers.push(lineRail);

        addStationPin(item.dep.lat, item.dep.lng, item.dep.name);
        addStationPin(item.arr.lat, item.arr.lng, item.arr.name);

        if (badgeEl) {
          badgeEl.innerHTML = `🚃 ${item.dep.name} → ${item.arr.name} (線路 約 ${formatDistance(item.railSeg.distance)})`;
        }
        continue;
      }

      if (item.type === 'train_unset') {
        if (badgeEl) {
          badgeEl.innerHTML = `🚃 発車駅・到着駅を選択してください`;
        }
        continue;
      }

      const { mode, segment } = item;
      let lineColor = '#0ea5e9';
      if (mode === 'bike') lineColor = '#10b981';
      if (mode === 'walk') lineColor = '#f59e0b';
      if (mode === 'car') lineColor = '#3b82f6';
      if (mode === 'plane') lineColor = '#ec4899';

      const polyline = L.polyline(segment.coords, {
        color: lineColor,
        weight: 5,
        opacity: 0.85,
        dashArray: segment.isStraight ? '8, 8' : null,
        lineJoin: 'round'
      }).addTo(window.map);
      window.routeLayers.push(polyline);

      if (badgeEl) {
        const distStr = formatDistance(segment.distance);
        if (mode === 'plane') {
          badgeEl.innerHTML = `✈️ 空路 直線 ${distStr}`;
        } else if (!segment.isStraight && segment.duration) {
          const durStr = formatDuration(segment.duration, mode || 'car');
          badgeEl.innerHTML = `<i data-lucide="navigation" class="w-3 h-3"></i> 道のり ${distStr} (${durStr})`;
        } else {
          badgeEl.innerHTML = `<i data-lucide="arrow-down" class="w-3 h-3"></i> 直線 約 ${distStr}`;
        }
      }
    }

    lucide.createIcons();
  }

  window.closeStationModal = () => document.getElementById('stationModal').classList.add('hidden');

  window.searchStation = async function(type) {
    const inputEl = document.getElementById(type === 'dep' ? 'depStationInput' : 'arrStationInput');
    const ul = document.getElementById(type === 'dep' ? 'depStationResults' : 'arrStationResults');
    const raw = inputEl.value.trim();
    if (!raw) return;

    ul.innerHTML = `<li class="p-2 text-slate-400">検索中...</li>`;
    const queryStr = raw.endsWith('駅') ? raw : `${raw} 駅`;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryStr)}&countrycodes=jp`);
    const data = await res.json();

    ul.innerHTML = "";
    if (data.length > 0) {
      data.slice(0, 5).forEach(item => {
        const stName = item.display_name.split(',')[0];
        const li = document.createElement('li');
        li.className = "p-2 hover:bg-purple-50 cursor-pointer flex justify-between items-center";
        li.innerHTML = `<span class="font-bold text-slate-700">🚉 ${stName}</span><span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">選択</span>`;
        li.onclick = () => {
          document.getElementById(`${type}StationName`).value = stName;
          document.getElementById(`${type}StationLat`).value = item.lat;
          document.getElementById(`${type}StationLng`).value = item.lon;
          inputEl.value = stName;
          const lbl = document.getElementById(`${type}StationSelectedLabel`);
          lbl.textContent = `✓ 選択済: ${stName}`;
          lbl.classList.remove('hidden');
          ul.innerHTML = "";
        };
        ul.appendChild(li);
      });
    } else {
      ul.innerHTML = `<li class="p-2 text-slate-400">駅が見つかりませんでした</li>`;
    }
  };

  window.saveStationRoute = async function(e) {
    e.preventDefault();
    const id = document.getElementById('stationSpotId').value;
    const depLat = parseFloat(document.getElementById('depStationLat').value);
    const depLng = parseFloat(document.getElementById('depStationLng').value);
    const depName = document.getElementById('depStationName').value;

    const arrLat = parseFloat(document.getElementById('arrStationLat').value);
    const arrLng = parseFloat(document.getElementById('arrStationLng').value);
    const arrName = document.getElementById('arrStationName').value;

    if (!depLat || !arrLat) {
      alert("発車駅と到着駅を検索してリストから選択してください。");
      return;
    }

    await updateDoc(doc(db, "pins", id), {
      transportToNext: 'train',
      trainRoute: {
        dep: { name: depName, lat: depLat, lng: depLng },
        arr: { name: arrName, lat: arrLat, lng: arrLng }
      }
    });

    closeStationModal();
  };

  window.toggleSearch = function() { document.getElementById('searchContainer').classList.toggle('hidden'); };
  window.executeSearch = async function() {
    const val = document.getElementById('searchInput').value.trim();
    if(!val) return;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}`);
    const data = await res.json();
    const ul = document.getElementById('searchResults'); ul.innerHTML = "";
    if(data.length > 0) {
      data.slice(0, 5).forEach(item => {
        const li = document.createElement('li');
        li.className = "p-3 hover:bg-sky-50 cursor-pointer flex justify-between items-center";
        li.innerHTML = `<span>${item.display_name.split(',')[0]}</span><span class="text-[10px] bg-sky-100 text-sky-600 px-2 py-1 rounded">ピンを打つ</span>`;
        li.onclick = () => {
          window.map.flyTo([item.lat, item.lon], 16);
          document.getElementById('searchContainer').classList.add('hidden');
          openAddModal(item.lat, item.lon, item.display_name.split(',')[0]);
        };
        ul.appendChild(li);
      });
    } else { ul.innerHTML = "<li class='p-3 text-slate-400'>見つかりませんでした</li>"; }
  };

  window.switchMainTab = function(tab) {
    if(tab === 'map') { 
      document.getElementById('timeline-panel').classList.replace('timeline-visible','timeline-hidden'); 
      document.getElementById('ui-layer').style.display='flex'; 
      if (window.map) window.map.invalidateSize();
    } else { 
      document.getElementById('timeline-panel').classList.replace('timeline-hidden','timeline-visible'); 
      document.getElementById('ui-layer').style.display='none'; 
      updateTabButtonsUI();
      renderRouteTimeline(true);
    }
  };

  function updateTabButtonsUI() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      if(btn.dataset.day === window.currentDayTab) {
        btn.className = "tab-btn flex-1 bg-sky-500 text-white rounded-lg py-1.5 text-xs font-bold shrink-0";
      } else {
        btn.className = "tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold shrink-0";
      }
    });
  }

  window.filterDay = function(day) { 
    window.currentDayTab = day; 
    updateTabButtonsUI();
    renderRouteTimeline(true); 
  };

  function getUserStyle(user) {
    if(user === 'ありねこ') return { badge: 'bg-rose-100 text-rose-700 border-rose-200', card: 'bg-rose-50/70 border-rose-200' };
    if(user === 'ことみねこ') return { badge: 'bg-teal-100 text-teal-700 border-teal-200', card: 'bg-teal-50/70 border-teal-200' };
    if(user === 'あつきねこ') return { badge: 'bg-indigo-100 text-indigo-700 border-indigo-200', card: 'bg-indigo-50/70 border-indigo-200' };
    return { badge: 'bg-slate-100 text-slate-600 border-slate-200', card: 'bg-slate-50 border-slate-200' };
  }

  // 写真を追加しても選択した絵文字アイコンをピンに表示
  function renderMarkers() {
    window.markers.forEach(m => window.map.removeLayer(m)); window.markers = [];
    window.spots.forEach(spot => {
      let ext = spot.status === 'done' ? "pin-done" : (spot.status === 'cancel' ? "pin-cancel" : "");
      let iconHtml = `<div class="custom-pin ${ext}" style="background-color:#38bdf8; width:34px; height:34px; font-size:17px;">${spot.iconEmoji || '📍'}</div>`;

      let marker = L.marker([spot.lat, spot.lng], { icon: L.divIcon({ html: iconHtml, className: '', iconSize: [34,34], iconAnchor:[17,34] }) }).addTo(window.map);
      
      let prioText = spot.priority === 'reserved' ? '✅ 予約済み' : ('★'.repeat(spot.priority||1));
      let urlsHtml = (spot.urls || []).filter(u=>u).map(u => `<a href="${u}" target="_blank" class="text-sky-500 underline block mt-0.5">🔗 URLを開く</a>`).join('');
      let photoHtml = spot.photo ? `<img src="${spot.photo}" class="w-full max-h-28 object-cover rounded-lg my-1 border border-slate-200">` : '';

      let evalListHtml = "";
      if(Array.isArray(spot.evaluations) && spot.evaluations.length > 0) {
        evalListHtml = `<div class="mt-1.5 space-y-1 border-t pt-1.5">` + spot.evaluations.map(ev => {
          const st = getUserStyle(ev.user);
          return `<div class="text-[10px] p-1.5 rounded-lg border ${st.card}">
            <div class="flex items-center justify-between">
              <span class="font-bold">🐱 ${ev.user}</span>
              <span class="text-amber-500">${'★'.repeat(ev.rating)}</span>
            </div>
            ${ev.comment ? `<div class="text-slate-700 mt-0.5">${ev.comment}</div>` : ''}
          </div>`;
        }).join('') + `</div>`;
      } else if (spot.rating) {
        evalListHtml = `<div class="text-[10px] text-pink-600 font-bold bg-pink-50 p-1 rounded mt-1">⭐ 評価: ${'★'.repeat(spot.rating)}</div>`;
      }

      let popupContent = `
      <div class="p-1 font-sans text-xs space-y-1 max-w-[230px]">
        <div class="font-extrabold text-slate-800 text-sm border-b pb-1">${spot.iconEmoji || '📍'} ${spot.name}</div>
        <div class="text-[10px] text-slate-500 flex justify-between">
          <span>📅 ${spot.date} ${spot.time}</span>
          <span class="font-bold text-amber-500">${prioText}</span>
        </div>
        <div class="text-[10px] text-sky-600 font-bold">📝 記録: ${spot.recordedBy || 'メンバー'}</div>
        ${photoHtml}
        ${spot.comment ? `<div class="text-[10px] bg-slate-50 p-1.5 rounded text-slate-600">${spot.comment}</div>` : ''}
        ${urlsHtml}
        ${evalListHtml}
      </div>`;

      marker.bindPopup(popupContent);
      window.markers.push(marker);
    });
  }

  function renderRouteTimeline(autoScroll = false) {
    const list = document.getElementById('routeTimelineList');
    const daySpots = window.spots.filter(s => s.date === window.currentDayTab);
    
    let firstUnfinishedIndex = -1;

    list.innerHTML = daySpots.map((spot, index) => {
      const isDone = spot.status === 'done';
      const isCancel = spot.status === 'cancel';
      const isMySpot = spot.recordedBy === window.currentUser;

      if(!isDone && !isCancel && firstUnfinishedIndex === -1) {
        firstUnfinishedIndex = index;
      }

      let prioText = spot.priority === 'reserved' ? '✅ 予約済み' : ('★'.repeat(spot.priority||1) + '☆'.repeat(3-(spot.priority||1)));
      let urlsHtml = (spot.urls || []).filter(u=>u).map(u => `<a href="${u}" target="_blank" class="text-sky-500 hover:underline inline-flex items-center gap-1 mt-1 break-all bg-sky-50 px-2 py-1 rounded-md w-full font-semibold"><i data-lucide="external-link" class="w-3 h-3"></i>URLをひらく</a>`).join('');
      let photoHtml = spot.photo ? `<img src="${spot.photo}" class="mt-2 rounded-xl max-h-44 object-cover w-full border border-slate-200 shadow-xs">` : '';
      
      let evalsHtml = "";
      if (Array.isArray(spot.evaluations) && spot.evaluations.length > 0) {
        evalsHtml = `
        <div class="mt-2.5 pt-2 border-t border-dashed border-slate-200 space-y-1.5">
          <div class="text-[10px] font-bold text-slate-400 flex items-center gap-1">💬 みんなの評価・記録 (${spot.evaluations.length}人)</div>
          ${spot.evaluations.map((ev, evIdx) => {
            const isMine = ev.user === window.currentUser;
            const st = getUserStyle(ev.user);
            const foodBadge = ev.foodType ? `<span class="text-[9px] bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded-full font-bold">🍽️ ${getFoodName(ev.foodType)} ×${ev.foodCount}</span>` : '';
            return `
            <div class="p-2.5 rounded-xl border ${st.card} flex justify-between items-start gap-2">
              <div class="space-y-1 flex-1">
                <div class="flex items-center flex-wrap gap-1.5">
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full border bg-white ${st.badge}">🐱 ${ev.user}</span>
                  <span class="text-amber-400 font-bold text-xs tracking-tighter">${'★'.repeat(ev.rating)}${'☆'.repeat(5 - ev.rating)}</span>
                  ${foodBadge}
                </div>
                ${ev.comment ? `<p class="text-slate-700 text-xs font-medium pl-1 leading-relaxed">${ev.comment}</p>` : ''}
              </div>
              ${isMine ? `<button onclick="deleteEvaluation('${spot.id}', ${evIdx})" class="text-[10px] text-rose-500 hover:bg-rose-100 bg-white border border-rose-200 px-2 py-1 rounded-lg font-bold shrink-0">削除</button>` : ''}
            </div>`;
          }).join('')}
        </div>`;
      } else if (spot.rating) {
        evalsHtml = `<div class="text-xs text-pink-700 bg-pink-50 p-2 rounded-xl font-bold mt-2">⭐ 評価済: ${'★'.repeat(spot.rating)} ${spot.evalComment || ''}</div>`;
      }

      const hasMyEval = Array.isArray(spot.evaluations) && spot.evaluations.some(ev => ev.user === window.currentUser);

      let connectorHtml = "";
      if (index < daySpots.length - 1) {
        const nextSpot = daySpots[index + 1];
        const straightDist = formatDistance(calcStraightDistance(spot.lat, spot.lng, nextSpot.lat, nextSpot.lng));
        const currentMode = spot.transportToNext || "";
        
        const modes = [
          { key: 'walk', label: '🚶 徒歩' },
          { key: 'bike', label: '🚲 自転車' },
          { key: 'train', label: '🚃 電車・バス' },
          { key: 'car', label: '🚗 シェアカー' },
          { key: 'plane', label: '✈️ 飛行機' }
        ];

        const modeButtons = modes.map(m => {
          const active = currentMode === m.key;
          return `<button onclick="updateTransport('${spot.id}', '${(active && m.key !== 'train') ? '' : m.key}')" class="px-2 py-1 rounded-full text-[10px] font-bold transition ${active ? (m.key === 'train' ? 'bg-purple-600 text-white shadow-sm' : 'bg-sky-500 text-white shadow-sm') : 'bg-white text-slate-500 border border-slate-200 hover:bg-sky-50'}">${m.label}</button>`;
        }).join('');

        let trainInfoHtml = "";
        if (currentMode === 'train' && spot.trainRoute && spot.trainRoute.dep && spot.trainRoute.arr) {
          trainInfoHtml = `
          <div class="flex items-center gap-1.5 text-[10px] text-purple-700 font-bold">
            <span class="bg-purple-100 px-2 py-0.5 rounded-full">🚉 ${spot.trainRoute.dep.name} ➔ ${spot.trainRoute.arr.name}</span>
            <button onclick="openStationModal('${spot.id}')" class="underline text-purple-600">駅変更</button>
            <button onclick="updateTransport('${spot.id}', '')" class="text-slate-400 hover:text-rose-500">解除</button>
          </div>`;
        }

        connectorHtml = `
        <div class="relative py-2.5 pl-6 flex flex-col gap-1.5">
          <div class="absolute left-3.5 top-0 bottom-0 w-0.5 border-l-2 border-dashed border-sky-300"></div>
          <div class="flex items-center gap-2">
            <span id="dist-badge-${spot.id}" class="text-[10px] font-extrabold text-sky-700 bg-sky-100/90 px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
              <i data-lucide="loader" class="w-3 h-3 animate-spin"></i> ルート計算中 (直線 ${straightDist})
            </span>
          </div>
          ${trainInfoHtml}
          <div class="flex flex-wrap gap-1">
            ${modeButtons}
          </div>
        </div>`;
      }

      return `
      <div>
        <div id="timeline-card-${index}" class="p-3.5 bg-white rounded-2xl shadow-sm border border-slate-200 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
              <span class="font-extrabold bg-sky-100 text-sky-700 px-2 py-1 rounded-full">${spot.time}</span>
              <span class="text-[10px] text-slate-600 font-bold bg-slate-100 px-2 py-0.5 rounded-full">📝 ${spot.recordedBy || 'メンバー'}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="${spot.priority==='reserved'?'text-rose-500':'text-amber-400'} font-bold">${prioText}</span>
              ${isMySpot ? `<button onclick="deleteSpot('${spot.id}')" title="自分の予定を削除" class="text-rose-400 hover:text-rose-600 p-0.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
            </div>
          </div>
          <div>
            <h3 class="font-bold text-sm ${spot.status==='cancel'?'line-through text-slate-400':''}">${spot.iconEmoji||'📍'} ${spot.name}</h3>
            ${photoHtml}
            ${spot.comment ? `<p class="text-xs text-slate-500 mt-1.5 bg-slate-50 p-2 rounded-xl">${spot.comment}</p>` : ''}
            <div class="flex flex-col gap-1 mt-1 text-[10px]">${urlsHtml}</div>
          </div>
          ${evalsHtml}
          <div class="pt-2 flex justify-between items-center text-xs border-t border-slate-100">
            <button onclick="openEditModal('${spot.id}')" class="text-slate-400 hover:text-sky-500 font-bold flex items-center gap-1">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>編集
            </button>
            <div class="flex gap-1.5">
              <button onclick="openEvalModal('${spot.id}')" class="px-2.5 py-1.5 rounded-xl bg-pink-50 text-pink-600 font-bold border border-pink-100">
                ${hasMyEval ? '✏️ 自分の評価を更新・削除' : '⭐ 評価・グルメ記録'}
              </button>
              <button onclick="updateStatus('${spot.id}', 'done')" class="px-3 py-1.5 rounded-xl ${isDone?'bg-pink-400 text-white':'bg-slate-100 text-slate-600'} font-bold">✓ 行った</button>
            </div>
          </div>
        </div>
        ${connectorHtml}
      </div>`;
    }).join('') || '<div class="text-center py-10 text-xs text-slate-400">予定がありません</div>';

    lucide.createIcons();
    drawMapRoutesAndUpdateDistances(daySpots);

    if(autoScroll && firstUnfinishedIndex !== -1) {
      setTimeout(() => {
        const card = document.getElementById(`timeline-card-${firstUnfinishedIndex}`);
        if(card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }
  }

  function getFoodName(type) {
    const map = { okonomi: 'お好み焼き', oyster: '牡蠣', momiji: 'もみじ饅頭', ramen: '尾道ラーメン', lemon: 'レモン' };
    return map[type] || '';
  }

  window.updateStatus = async function(id, st) {
    const spot = window.spots.find(s=>s.id===id);
    await updateDoc(doc(db, "pins", id), { status: spot.status===st ? 'pending' : st });
  };

  window.deleteSpot = async function(id) {
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;
    if (spot.recordedBy !== window.currentUser) {
      alert("自分が登録した予定のみ削除できます。");
      return;
    }
    if(confirm("自分が登録したこの予定を削除しますか？")) {
      await deleteDoc(doc(db, "pins", id));
    }
  };

  window.autoSetEmoji = function() {
    const emojis = { sightseeing:'🚴', gourmet:'🦪', hotel:'🏨', other:'📍' };
    document.getElementById('spotEmoji').value = emojis[document.getElementById('spotGenre').value] || '📍';
  };

  window.checkAndAddUrlInput = function() {
    const inputs = document.querySelectorAll('.spotUrlInput');
    const lastInput = inputs[inputs.length - 1];
    if(lastInput.value.trim() !== "") {
      const newInput = document.createElement('input');
      newInput.type = "url"; newInput.className = "spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400 mt-2";
      newInput.placeholder = "追加のURL..."; newInput.oninput = window.checkAndAddUrlInput;
      document.getElementById('urlContainer').appendChild(newInput);
    }
  };

  window.openAddModal = function(lat, lng, name="") {
    document.getElementById('spotForm').reset();
    document.getElementById('editSpotId').value = "";
    window.clearPhoto();
    document.getElementById('modalTitle').innerHTML = `<i data-lucide="map-pin" class="w-5 h-5 text-sky-500"></i>場所を追加`;
    document.getElementById('urlContainer').innerHTML = `<label class="block font-bold text-slate-600 mb-1">参考URL</label><input type="url" class="spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400" placeholder="https://..." oninput="checkAndAddUrlInput()">`;
    document.getElementById('spotLat').value = lat || (window.map ? window.map.getCenter().lat : 34.25);
    document.getElementById('spotLng').value = lng || (window.map ? window.map.getCenter().lng : 133.00);
    document.getElementById('spotName').value = name;
    document.getElementById('spotDate').value = window.currentDayTab;
    document.getElementById('spotModal').classList.remove('hidden');
    window.autoSetEmoji();
    lucide.createIcons();
  };

  window.openEditModal = function(id) {
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;

    document.getElementById('spotForm').reset();
    document.getElementById('editSpotId').value = spot.id;
    document.getElementById('modalTitle').innerHTML = `<i data-lucide="edit-3" class="w-5 h-5 text-sky-500"></i>予定を編集`;
    document.getElementById('spotName').value = spot.name || "";
    document.getElementById('spotDate').value = spot.date || "11/30";
    document.getElementById('spotTime').value = spot.time || "09:00";
    document.getElementById('spotPriority').value = spot.priority || "3";
    document.getElementById('spotEmoji').value = spot.iconEmoji || "📍";
    document.getElementById('spotComment').value = spot.comment || "";
    document.getElementById('spotLat').value = spot.lat;
    document.getElementById('spotLng').value = spot.lng;

    if (spot.photo) {
      window.currentPhotoBase64 = spot.photo;
      document.getElementById('photoPreview').src = spot.photo;
      document.getElementById('photoPreviewBox').classList.remove('hidden');
    } else {
      window.clearPhoto();
    }

    const container = document.getElementById('urlContainer');
    container.innerHTML = `<label class="block font-bold text-slate-600 mb-1">参考URL</label>`;
    const urls = (spot.urls && spot.urls.length > 0) ? spot.urls : [""];
    urls.forEach(url => {
      const input = document.createElement('input');
      input.type = "url";
      input.className = "spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400 mb-2";
      input.value = url;
      input.oninput = window.checkAndAddUrlInput;
      container.appendChild(input);
    });

    document.getElementById('spotModal').classList.remove('hidden');
    lucide.createIcons();
  };

  window.closeAddModal = () => document.getElementById('spotModal').classList.add('hidden');

  window.saveSpot = async function(e) {
    e.preventDefault();
    const editId = document.getElementById('editSpotId').value;
    const urls = Array.from(document.querySelectorAll('.spotUrlInput')).map(i=>i.value.trim()).filter(v=>v!=="");
    
    const spotData = {
      name: document.getElementById('spotName').value,
      date: document.getElementById('spotDate').value,
      time: document.getElementById('spotTime').value,
      sortTime: parseInt(document.getElementById('spotDate').value.replace('/','') + document.getElementById('spotTime').value.replace(':','')) * 100,
      priority: document.getElementById('spotPriority').value,
      iconEmoji: document.getElementById('spotEmoji').value,
      comment: document.getElementById('spotComment').value,
      urls: urls,
      photo: window.currentPhotoBase64 || null,
      lat: parseFloat(document.getElementById('spotLat').value),
      lng: parseFloat(document.getElementById('spotLng').value)
    };

    if(editId) {
      await updateDoc(doc(db, "pins", editId), spotData);
    } else {
      await addDoc(pinsCollection, {
        ...spotData,
        status: 'pending',
        recordedBy: window.currentUser || 'メンバー',
        evaluations: []
      });
    }

    closeAddModal();
  };

  window.openEvalModal = function(id) {
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;

    const currentUser = window.currentUser || 'メンバー';
    document.getElementById('evalSpotId').value = id;
    document.getElementById('evalUserBadge').textContent = `記録者: 🐱 ${currentUser}`;

    const existingEval = Array.isArray(spot.evaluations)
      ? spot.evaluations.find(ev => ev.user === currentUser)
      : null;

    if (existingEval) {
      document.getElementById('evalRating').value = existingEval.rating || "5";
      document.getElementById('evalComment').value = existingEval.comment || "";
      document.getElementById('evalFoodType').value = existingEval.foodType || "";
      document.getElementById('evalFoodCount').value = existingEval.foodCount || "1";
      document.getElementById('evalEditNotice').classList.remove('hidden');
      document.getElementById('btnSubmitEval').textContent = "更新する";
      document.getElementById('deleteMyEvalWrapper').classList.remove('hidden');
    } else {
      document.getElementById('evalRating').value = "5";
      document.getElementById('evalComment').value = "";
      document.getElementById('evalFoodType').value = "";
      document.getElementById('evalFoodCount').value = "1";
      document.getElementById('evalEditNotice').classList.add('hidden');
      document.getElementById('btnSubmitEval').textContent = "記録する";
      document.getElementById('deleteMyEvalWrapper').classList.add('hidden');
    }

    document.getElementById('evalModal').classList.remove('hidden');
    lucide.createIcons();
  };
  window.closeEvalModal = () => document.getElementById('evalModal').classList.add('hidden');

  window.submitEvaluation = async function(e) {
    e.preventDefault();
    const id = document.getElementById('evalSpotId').value;
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;

    const currentUser = window.currentUser || 'メンバー';
    let evaluations = Array.isArray(spot.evaluations) ? [...spot.evaluations] : [];

    const myIndex = evaluations.findIndex(ev => ev.user === currentUser);
    const newEval = {
      user: currentUser,
      rating: parseInt(document.getElementById('evalRating').value),
      comment: document.getElementById('evalComment').value.trim(),
      foodType: document.getElementById('evalFoodType').value,
      foodCount: parseInt(document.getElementById('evalFoodCount').value) || 1
    };

    if (myIndex !== -1) {
      evaluations[myIndex] = newEval;
    } else {
      evaluations.push(newEval);
    }

    await updateDoc(doc(db, "pins", id), {
      evaluations: evaluations,
      status: 'done'
    });
    closeEvalModal();
  };

  window.deleteMyEvaluationFromModal = async function() {
    const id = document.getElementById('evalSpotId').value;
    const spot = window.spots.find(s => s.id === id);
    if (!spot || !Array.isArray(spot.evaluations)) return;

    if (!confirm("このスポットに記録した自分の評価とグルメカウントを完全に取り消しますか？")) return;

    const currentUser = window.currentUser || 'メンバー';
    const updatedEvals = spot.evaluations.filter(ev => ev.user !== currentUser);

    const updateData = { evaluations: updatedEvals };
    if (updatedEvals.length === 0) {
      updateData.status = 'pending';
    }

    await updateDoc(doc(db, "pins", id), updateData);
    closeEvalModal();
  };

  window.deleteEvaluation = async function(spotId, evalIndex) {
    const spot = window.spots.find(s => s.id === spotId);
    if (!spot || !Array.isArray(spot.evaluations)) return;

    const targetEval = spot.evaluations[evalIndex];
    if (!targetEval || targetEval.user !== window.currentUser) {
      alert("自分の評価記録のみ削除できます。");
      return;
    }

    if (!confirm("自分の評価記録を削除しますか？")) return;

    const updatedEvals = spot.evaluations.filter((_, idx) => idx !== evalIndex);
    const updateData = { evaluations: updatedEvals };
    if (updatedEvals.length === 0) {
      updateData.status = 'pending';
    }

    await updateDoc(doc(db, "pins", spotId), updateData);
  };

  window.resetToDefaultBounds = function() {
    if(window.map) window.map.setView([34.25, 133.00], 10);
  };
</script>
</body>
</html>
