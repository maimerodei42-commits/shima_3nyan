<!-- Google Fonts (柔らかい丸ゴシック系) -->

<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background-color: #f0f8ff;
    margin: 0; padding: 0; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  
  /* マップ画面の高さ・レイアウト固定 */
  #map {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: calc(56px + var(--sab));
    width: 100%; z-index: 1;
  }
  
  #ui-layer {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: calc(56px + var(--sab));
    z-index: 1000; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding-top: var(--sat);
  }
  
  .pointer-events-auto { pointer-events: auto; }
  .pale-map-tiles { filter: brightness(1.02) contrast(0.98); }

  /* タイムライン画面 (全画面切り替え) */
  #timeline-panel { 
    position: fixed; top: 0; left: 0; right: 0;
    bottom: calc(56px + var(--sab)); 
    z-index: 1500; background-color: #f8fafc;
    padding-top: var(--sat);
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .timeline-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .timeline-visible { opacity: 1; visibility: visible; pointer-events: auto; }

  /* ナビゲーションバー */
  #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; padding-bottom: var(--sab); }

  .custom-pin {
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: white; font-weight: bold;
    box-shadow: 0 4px 8px rgba(0,0,0,0.25); border: 2px solid white;
  }
  .pin-done { background-color: #94a3b8 !important; opacity: 0.7; }
  .pin-cancel { background-color: #cbd5e1 !important; opacity: 0.4; line-through: true; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* アニメーション */
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  
  .toast-enter { animation: slideDown 0.3s ease-out forwards; }
  .toast-exit { animation: slideUp 0.3s ease-in forwards; }
  @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
</style>
</head>

  const memberStyles = {
    "ありねこ": { border: "border-rose-400", ring: "ring-rose-200", bg: "bg-rose-50", text: "text-rose-700", hex: "#fb7185", icon: "🐱" },
    "ことみねこ": { border: "border-teal-400", ring: "ring-teal-200", bg: "bg-teal-50", text: "text-teal-700", hex: "#2dd4bf", icon: "🐱" },
    "クロスバイカーあつき": { border: "border-indigo-400", ring: "ring-indigo-200", bg: "bg-indigo-50", text: "text-indigo-700", hex: "#818cf8", icon: "🚴‍♂️" }
  };

  const getMemberStyle = (name) => memberStyles[name] || { border: "border-sky-300", ring: "ring-sky-100", bg: "bg-slate-50", text: "text-slate-600", hex: "#38bdf8", icon: "🐾" };

  // グローバル保持
  window.currentUser = "";
  window.map = null;
  window.markers = [];
  window.spots = [];
  window.currentDayTab = "11/30";
  window.currentPhotoBase64 = null;

  // デフォルト表示エリア（今治〜尾道〜広島エリア）
  const defaultBounds = L.latLngBounds([34.00, 132.30], [34.45, 133.30]);

  // オンロード初期化
  window.onload = function() {
    lucide.createIcons();
    initTimeOptions();

    // 1. スプラッシュ表示（2秒後に「あなたはだれ？」に切り替え）
    setTimeout(() => {
      document.getElementById('splashTitle').classList.add('hidden');
      document.getElementById('userSelectBox').classList.remove('hidden');
    }, 2000);

    // 写真圧縮リスナー
    document.getElementById('spotPhotoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 500;
          canvas.width = MAX_WIDTH; canvas.height = img.height * (MAX_WIDTH / img.width);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          window.currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('photoPreview').src = window.currentPhotoBase64;
          document.getElementById('photoPreview').classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  };

  function initTimeOptions() {
    const timeSelect = document.getElementById('spotTime');
    timeSelect.innerHTML = "";
    for (let i = 0; i < 24; i++) {
      const timeStr = `${String(i).padStart(2, '0')}:00`;
      const opt = document.createElement('option');
      opt.value = timeStr; opt.textContent = timeStr;
      timeSelect.appendChild(opt);
    }
  }

  // ユーザー選択
  window.selectUser = function(userName) {
    window.currentUser = userName;
    document.getElementById('currentUserBadge').textContent = currentUser;
    document.getElementById('spotMember').value = currentUser;
    document.getElementById('splashScreen').classList.add('hidden');
    initMap();
    showToast(`${currentUser} として参加しました`, "success");
  };

  // トースト表示
  window.showToast = function(msg, type='info') {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    const colors = { success:'bg-emerald-600', error:'bg-rose-500', info:'bg-slate-800' };
    t.className = `flex items-center gap-2 px-4 py-3 rounded-full shadow-lg font-bold text-xs text-white toast-enter ${colors[type]}`;
    t.innerHTML = `<span>${msg}</span>`;
    container.appendChild(t);
    setTimeout(() => { t.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => t.remove(), 300); }, 3000);
  };

  // Leafletマップ初期化 (地理院タイル)
  function initMap() {
    if (window.map) return;
    window.map = L.map('map', { zoomControl: false, tap: false });
    window.map.fitBounds(defaultBounds);
    
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
      maxZoom: 18,
      className: 'pale-map-tiles'
    }).addTo(window.map);

    L.control.zoom({ position: 'bottomright' }).addTo(window.map);

    window.map.on('click', function(e) {
      openAddModal(e.latlng.lat, e.latlng.lng);
    });

    // Firestore リアルタイム同期開始
    onSnapshot(q, (snapshot) => {
      window.spots = [];
      let foodTotals = { okonomi: 0, oyster: 0, momiji: 0, ramen: 0, lemon: 0 };

      snapshot.forEach(d => {
        const data = d.data();
        window.spots.push({ id: d.id, ...data });
        if(data.foodType && data.status !== 'cancel' && foodTotals[data.foodType] !== undefined) {
          foodTotals[data.foodType] += (data.foodCount || 1);
        }
      });

      // カウンター反映
      document.getElementById('cnt-okonomi').innerText = foodTotals.okonomi;
      document.getElementById('cnt-oyster').innerText = foodTotals.oyster;
      document.getElementById('cnt-momiji').innerText = foodTotals.momiji;
      document.getElementById('cnt-ramen').innerText = foodTotals.ramen;
      document.getElementById('cnt-lemon').innerText = foodTotals.lemon;

      // 未完了の予定があるタブに自動フォーカス
      let firstUnfinished = window.spots.find(s => !s.status || s.status === 'pending');
      if (firstUnfinished && firstUnfinished.date) {
        window.currentDayTab = firstUnfinished.date;
      }

      updateTabUI();
      renderMarkers();
      renderRouteTimeline();
    });
  }

  // 初期画角に戻す
  window.resetToDefaultBounds = function() {
    if(window.map) {
      window.map.fitBounds(defaultBounds, { duration: 1.0 });
      showToast("全体マップに戻りました", "info");
    }
  };

  // 検索機能 (Nominatim API)
  window.toggleSearch = function() {
    document.getElementById('searchBox').classList.toggle('hidden');
  };

  window.executeSearch = async function() {
    const val = document.getElementById('searchInput').value.trim();
    if(!val) return;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}`);
      const data = await res.json();
      if(data && data.length > 0) {
        window.map.flyTo([data[0].lat, data[0].lon], 15);
        showToast("検索場所へ移動しました", "success");
      } else {
        showToast("見つかりませんでした", "error");
      }
    } catch(e) { showToast("検索エラー", "error"); }
  };

  // ナビゲーション切り替え
  window.switchMainTab = function(tab) {
    const uiLayer = document.getElementById('ui-layer');
    const panel = document.getElementById('timeline-panel');
    const btnMap = document.getElementById('navBtnMap');
    const btnRoute = document.getElementById('navBtnRoute');

    if (tab === 'map') {
      panel.classList.replace('timeline-visible', 'timeline-hidden');
      uiLayer.style.display = 'flex';
      btnMap.className = "flex-1 py-2.5 flex flex-col items-center gap-0.5 text-sky-600 font-bold text-xs";
      btnRoute.className = "flex-1 py-2.5 flex flex-col items-center gap-0.5 text-slate-400 font-bold text-xs hover:text-sky-600 transition";
      if (window.map) window.map.invalidateSize();
    } else {
      panel.classList.replace('timeline-hidden', 'timeline-visible');
      uiLayer.style.display = 'none';
      btnRoute.className = "flex-1 py-2.5 flex flex-col items-center gap-0.5 text-sky-600 font-bold text-xs";
      btnMap.className = "flex-1 py-2.5 flex flex-col items-center gap-0.5 text-slate-400 font-bold text-xs hover:text-sky-600 transition";
      renderRouteTimeline(true);
    }
  };

  // タブ切り替えUI
  function updateTabUI() {
    document.querySelectorAll('.tab-btn').forEach(b => {
      if(b.dataset.day === window.currentDayTab) {
        b.classList.replace('bg-slate-100', 'bg-sky-500'); b.classList.replace('text-slate-500', 'text-white');
      } else {
        b.classList.replace('bg-sky-500', 'bg-slate-100'); b.classList.replace('text-white', 'text-slate-500');
      }
    });
  }

  window.filterDay = function(dayStr) {
    window.currentDayTab = dayStr;
    updateTabUI();
    renderRouteTimeline(false);
  };

  // ピン描画 (メンバー毎の色とアイコンを反映)
  function renderMarkers() {
    if (!window.map) return;
    window.markers.forEach(m => window.map.removeLayer(m));
    window.markers = [];

    window.spots.forEach(spot => {
      let extraClass = "";
      if (spot.status === 'done') extraClass = "pin-done";
      if (spot.status === 'cancel') extraClass = "pin-cancel";

      const style = getMemberStyle(spot.createdBy);

      let customHtml = `<div class="custom-pin ${extraClass}" style="background-color:${style.hex}; width:32px; height:32px; font-size:14px;">${style.icon}</div>`;
      if(spot.photo) {
        customHtml = `<div class="custom-pin overflow-hidden border-2 ${extraClass}" style="border-color:${style.hex}; width:36px; height:36px;"><img src="${spot.photo}" class="w-full h-full object-cover"></div>`;
      }

      const customIcon = L.divIcon({ html: customHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 36], popupAnchor: [0, -36] });
      const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(window.map);

      let popupContent = `<div class="p-1 text-center font-sans text-xs">
        <div class="font-bold text-slate-800">${spot.name}</div>
        <div class="text-[10px] ${style.text} font-bold mt-0.5">${spot.date} ${spot.time} (${style.icon} ${spot.createdBy || 'メンバー'})</div>
        ${spot.url ? `<a href="${spot.url}" target="_blank" class="text-[10px] text-blue-500 underline block mt-1">URLを開く</a>` : ''}
        <button onclick="deleteSpot('${spot.id}')" class="mt-2 text-rose-500 text-[10px] underline">削除する</button>
      </div>`;

      marker.bindPopup(popupContent);
      window.markers.push(marker);
    });
  }

  // タイムライン描画 (メンバー色で枠を装飾)
  function renderRouteTimeline(autoScroll = false) {
    const container = document.getElementById('routeTimelineList');
    document.getElementById('routeCountBadge').textContent = `${window.spots.length}件`;

    const daySpots = window.spots.filter(s => s.date === window.currentDayTab);

    if (daySpots.length === 0) {
      container.innerHTML = `<div class="text-center py-10 text-xs text-slate-400">この日の予定はまだありません。<br>マップからピンを追加してください！</div>`;
      return;
    }

    let html = "";
    let firstPendingIndex = -1;
    let timeCount = {};

    daySpots.forEach((spot, idx) => {
      if(!timeCount[spot.time]) timeCount[spot.time] = 1; else timeCount[spot.time]++;
      const badgeNum = timeCount[spot.time] > 1 ? ` <span class="bg-sky-600 text-white rounded-full px-1.5 py-0.5 text-[10px] ml-1">①</span>`.replace('①', String.fromCharCode(9311 + timeCount[spot.time])) : (timeCount[spot.time]===1 && daySpots.filter(s=>s.time===spot.time).length > 1 ? ` <span class="bg-sky-600 text-white rounded-full px-1.5 py-0.5 text-[10px] ml-1">①</span>` : '');

      const isDone = spot.status === 'done';
      const isCancel = spot.status === 'cancel';
      const isPending = !isDone && !isCancel;

      if (isPending && firstPendingIndex === -1) {
        firstPendingIndex = idx;
      }

      const stars = '★'.repeat(parseInt(spot.priority || 3)) + '☆'.repeat(3 - parseInt(spot.priority || 3));
      const prevId = idx > 0 ? daySpots[idx-1].id : null;
      const nextId = idx < daySpots.length - 1 ? daySpots[idx+1].id : null;

      // メンバーに応じたスタイルを取得
      const mStyle = getMemberStyle(spot.createdBy);
      
      // 未完了ならメンバーの色で枠を囲う
      const borderClass = isPending ? `${mStyle.border} ring-2 ${mStyle.ring}` : 'border-slate-200 opacity-75';

      let photoHtml = spot.photo ? `<img src="${spot.photo}" class="mt-2 rounded-xl max-h-32 object-cover w-full border border-slate-200">` : "";
      let foodHtml = spot.foodType ? `<div class="mt-1 text-[10px] font-bold text-orange-600 bg-orange-50 inline-block px-2 py-0.5 rounded-full">🥞 グルメ +${spot.foodCount || 1}</div>` : "";

      html += `
      <div id="route-card-${idx}" class="p-3.5 bg-white rounded-2xl shadow-sm border ${borderClass} space-y-2 transition">
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-1">
            <div class="flex flex-col items-center">
              ${prevId ? `<button onclick="swapOrder('${spot.id}', '${prevId}')" class="text-slate-300 hover:text-sky-500"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>` : ''}
              <span class="font-extrabold bg-sky-100 text-sky-700 px-2 py-0.5 rounded-full">${spot.time}${badgeNum}</span>
              ${nextId ? `<button onclick="swapOrder('${spot.id}', '${nextId}')" class="text-slate-300 hover:text-sky-500"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>` : ''}
            </div>
            <!-- 更新者のバッジ表示 -->
            <span class="text-[10px] font-bold ${mStyle.text} ${mStyle.bg} border ${mStyle.border} px-2 py-0.5 rounded-md ml-1 flex items-center gap-1">
              ${mStyle.icon} ${spot.createdBy || 'メンバー'}
            </span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-amber-400 font-bold text-xs">${stars}</span>
            <button onclick="deleteSpot('${spot.id}')" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>

        <div onclick="jumpToSpot('${spot.id}')" class="cursor-pointer">
          <h3 class="font-bold text-sm text-slate-800 ${isCancel ? 'line-through text-slate-400' : ''}">${spot.name}</h3>
          ${foodHtml}
          ${spot.url ? `<a href="${spot.url}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-sky-500 hover:underline flex items-center gap-1 mt-0.5"><i data-lucide="external-link" class="w-3 h-3"></i> リンクを開く</a>` : ''}
          ${spot.comment ? `<p class="text-xs text-slate-500 mt-1 bg-slate-50 p-2 rounded-xl">${spot.comment}</p>` : ''}
          ${photoHtml}
        </div>

        ${spot.rating ? `<div class="text-xs text-amber-600 bg-amber-50 p-2 rounded-xl font-bold">評価: ${'★'.repeat(spot.rating)} ${spot.evalComment || ''} (${spot.evaluatedBy || ''})</div>` : ''}

        <!-- 操作ボタン群 -->
        <div class="pt-2 border-t border-slate-100 flex items-center justify-end gap-1.5 text-xs">
          <button onclick="openEvalModal('${spot.id}')" class="px-2.5 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold flex items-center gap-1 transition">
            ⭐ 評価
          </button>
          <button onclick="updateSpotStatus('${spot.id}', 'done')" class="px-3 py-1.5 rounded-xl ${isDone ? 'bg-teal-600 text-white' : 'bg-teal-50 hover:bg-teal-100 text-teal-700'} font-bold transition">
            ✓ 行った！
          </button>
          <button onclick="updateSpotStatus('${spot.id}', 'cancel')" class="px-2.5 py-1.5 rounded-xl ${isCancel ? 'bg-slate-400 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'} font-bold transition">
            キャンセル
          </button>
        </div>
      </div>`;
    });

    container.innerHTML = html;
    lucide.createIcons();

    if (autoScroll && firstPendingIndex !== -1) {
      setTimeout(() => {
        const targetEl = document.getElementById(`route-card-${firstPendingIndex}`);
        if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  }

  // タイムライン項目タップでマップにジャンプ
  window.jumpToSpot = function(id) {
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;
    switchMainTab('map');
    window.map.flyTo([spot.lat, spot.lng], 16, { duration: 0.8 });
  };

  // 順序入れ替え
  window.swapOrder = async function(idA, idB) {
    const pinA = window.spots.find(p => p.id === idA);
    const pinB = window.spots.find(p => p.id === idB);
    if(!pinA || !pinB) return;
    await updateDoc(doc(db, "pins", idA), { sortTime: pinB.sortTime });
    await updateDoc(doc(db, "pins", idB), { sortTime: pinA.sortTime });
  };

  // ステータス更新
  window.updateSpotStatus = async function(id, newStatus) {
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;
    const nextStatus = spot.status === newStatus ? 'pending' : newStatus;
    await updateDoc(doc(db, "pins", id), { status: nextStatus });
    showToast("ステータスを更新しました", "success");
  };

  // 削除
  window.deleteSpot = async function(id) {
    if(confirm("この予定を削除しますか？")) {
      await deleteDoc(doc(db, "pins", id));
      showToast("削除しました", "success");
    }
  };

  // 評価モーダル
  window.openEvalModal = function(id) {
    const spot = window.spots.find(s => s.id === id);
    if (!spot) return;
    document.getElementById('evalSpotId').value = id;
    document.getElementById('evalComment').value = spot.evalComment || "";
    document.getElementById('evalModal').classList.remove('hidden');
  };

  window.closeEvalModal = function() {
    document.getElementById('evalModal').classList.add('hidden');
  };

  window.submitEvaluation = async function(e) {
    e.preventDefault();
    const id = document.getElementById('evalSpotId').value;
    await updateDoc(doc(db, "pins", id), {
      rating: parseInt(document.getElementById('evalRating').value),
      evalComment: document.getElementById('evalComment').value,
      evaluatedBy: window.currentUser
    });
    closeEvalModal();
    showToast("評価を保存しました！", "success");
  };

  // モーダル追加処理
  window.openAddModal = function(lat = null, lng = null) {
    document.getElementById('spotForm').reset();
    const center = window.map ? window.map.getCenter() : { lat: 34.18, lng: 133.00 };
    document.getElementById('spotLat').value = lat || center.lat;
    document.getElementById('spotLng').value = lng || center.lng;
    document.getElementById('spotMember').value = window.currentUser || "ありねこ";
    window.currentPhotoBase64 = null;
    document.getElementById('photoPreview').classList.add('hidden');
    document.getElementById('spotModal').classList.remove('hidden');
  };

  window.closeAddModal = function() {
    document.getElementById('spotModal').classList.add('hidden');
  };

  window.saveSpot = async function(e) {
    e.preventDefault();
    const name = document.getElementById('spotName').value.trim();
    if(!name) return showToast("スポット名を入力してください", "error");

    const day = document.getElementById('spotDate').value;
    const time = document.getElementById('spotTime').value;
    const sortTime = parseInt(day.replace('/','') + time.replace(':','')) * 100;

    const btn = document.getElementById('btnSaveSpot');
    btn.disabled = true; btn.innerText = "保存中...";

    try {
      await addDoc(pinsCollection, {
        name: name,
        date: day,
        time: time,
        sortTime: sortTime,
        url: document.getElementById('spotUrl').value,
        priority: document.getElementById('spotPriority').value,
        genre: document.getElementById('spotGenre').value,
        comment: document.getElementById('spotComment').value,
        lat: parseFloat(document.getElementById('spotLat').value),
        lng: parseFloat(document.getElementById('spotLng').value),
        status: 'pending',
        createdBy: document.getElementById('spotMember').value,
        photo: window.currentPhotoBase64,
        foodType: document.getElementById('spotFoodType').value,
        foodCount: parseInt(document.getElementById('spotFoodCount').value) || 1
      });

      showToast("追加しました！", "success");
      closeAddModal();
    } catch(err) {
      showToast("保存に失敗しました", "error");
    } finally {
      btn.disabled = false; btn.innerText = "保存する";
    }
  };

  // GPS
  window.locateUser = function() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      window.map.flyTo([pos.coords.latitude, pos.coords.longitude], 14);
      showToast("現在地に移動しました", "info");
    });
  };
</script>
</body>
</html>
