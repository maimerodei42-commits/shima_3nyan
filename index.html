<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>しまねこトリオ旅マップ 🐾</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    body { margin: 0; padding: 0; overflow: hidden; background-color: #f0f9ff; -webkit-tap-highlight-color: transparent; }
    
    /* 地図とUIを絶対座標で固定 */
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); z-index: 1; width: 100%; }
    
    /* UIレイヤー (ヘッダーや右下のボタンなど) */
    #ui-layer { position: absolute; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); z-index: 1000; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding-top: var(--sat); }
    
    .pointer-events-auto { pointer-events: auto; }
    
    /* タイムライン画面 (タブ切り替え用) */
    #timeline-panel { 
      position: fixed; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); 
      z-index: 1500; background-color: #f8fafc; padding-top: var(--sat);
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .timeline-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .timeline-visible { opacity: 1; visibility: visible; pointer-events: auto; }

    /* ボトムナビゲーション */
    #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; padding-bottom: var(--sab); }

    /* スプラッシュスクリーン */
    #splash-screen { transition: opacity 0.5s ease-out; }

    /* トースト通知 */
    .toast-enter { animation: slideDown 0.3s ease-out forwards; }
    .toast-exit { animation: slideUp 0.3s ease-in forwards; }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }

    /* ピン */
    .custom-pin { background: white; border: 3px solid #3b82f6; border-radius: 50%; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: transform 0.2s; }
    .custom-pin.done-pin { border-color: #94a3b8; opacity: 0.8; }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .item-done { opacity: 0.6; filter: grayscale(50%); transition: all 0.3s; }
  </style>
</head>
<body class="font-sans text-slate-800">

  <!-- タイトル＆プレイヤー選択画面 (スプラッシュスクリーン) -->
  <div id="splash-screen" class="fixed inset-0 bg-blue-50 z-[4000] flex flex-col items-center justify-center p-6 pt-[var(--sat)] pb-[var(--sab)]">
    <div class="text-center mb-10">
      <div class="text-6xl mb-4">🐾</div>
      <h1 class="text-2xl font-extrabold text-blue-900 mb-2">しまねこトリオ旅マップ</h1>
      <p class="text-sm font-bold text-blue-500">2023.11.30 - 12.3</p>
    </div>

    <div class="w-full max-w-sm space-y-4">
      <p class="text-center text-sm font-bold text-slate-500 mb-4">あなたは誰ですか？</p>
      
      <button class="player-select-btn w-full bg-white p-4 rounded-2xl shadow-sm border border-orange-100 flex items-center justify-center gap-3 active:scale-95 transition" data-player="ありねこ">
        <span class="text-2xl">🐈</span> <span class="font-bold text-orange-700 text-lg">ありねこ</span>
      </button>
      <button class="player-select-btn w-full bg-white p-4 rounded-2xl shadow-sm border border-purple-100 flex items-center justify-center gap-3 active:scale-95 transition" data-player="ことみねこ">
        <span class="text-2xl">🐈‍⬛</span> <span class="font-bold text-purple-700 text-lg">ことみねこ</span>
      </button>
      <button class="player-select-btn w-full bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-center gap-3 active:scale-95 transition" data-player="あつき">
        <span class="text-2xl">🚲</span> <span class="font-bold text-emerald-700 text-lg">あつき</span>
      </button>
    </div>
  </div>

  <div id="toast-container" class="fixed top-0 left-0 right-0 z-[3000] flex flex-col items-center pt-[calc(env(safe-area-inset-top)+10px)] pointer-events-none gap-2 px-4"></div>

  <!-- 地図コンテナ -->
  <div id="map"></div>

  <!-- UIレイヤー -->
  <div id="ui-layer">
    <!-- ヘッダー部分 -->
    <div class="p-4 space-y-2 pointer-events-auto w-full box-border">
      <header class="bg-white/95 backdrop-blur-md shadow-md rounded-2xl p-3 border border-blue-100 flex justify-between items-center relative z-[1001]">
        <div>
          <h1 class="text-blue-900 font-extrabold text-base tracking-tight m-0 leading-none">しまねこトリオ旅マップ 🐾</h1>
          <p class="text-[10px] text-blue-500 font-bold mt-1 mb-0 leading-none"><i class="far fa-calendar-alt"></i> 11/30 - 12/3</p>
        </div>
        <button id="btn-search-toggle" class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center active:scale-95 transition border border-blue-100 shrink-0">
          <i class="fas fa-search"></i>
        </button>
      </header>

      <!-- グルメカウンター -->
      <div class="bg-white/90 backdrop-blur shadow-sm rounded-xl p-2 flex gap-3 overflow-x-auto hide-scrollbar border border-orange-100 relative z-[1001]">
        <div class="flex items-center gap-1 shrink-0"><span class="text-xl">🥞</span><span class="text-xs font-bold text-slate-600">お好み焼き</span><span id="cnt-okonomi" class="font-bold text-orange-500 ml-1 text-lg">0</span></div>
        <div class="flex items-center gap-1 shrink-0"><span class="text-xl">🦪</span><span class="text-xs font-bold text-slate-600">牡蠣</span><span id="cnt-oyster" class="font-bold text-orange-500 ml-1 text-lg">0</span></div>
        <div class="flex items-center gap-1 shrink-0"><span class="text-xl">🍁</span><span class="text-xs font-bold text-slate-600">もみじ饅頭</span><span id="cnt-momiji" class="font-bold text-orange-500 ml-1 text-lg">0</span></div>
        <div class="flex items-center gap-1 shrink-0"><span class="text-xl">🍜</span><span class="text-xs font-bold text-slate-600">尾道ラーメン</span><span id="cnt-ramen" class="font-bold text-orange-500 ml-1 text-lg">0</span></div>
        <div class="flex items-center gap-1 shrink-0"><span class="text-xl">🍋</span><span class="text-xs font-bold text-slate-600">レモン</span><span id="cnt-lemon" class="font-bold text-orange-500 ml-1 text-lg">0</span></div>
      </div>

      <!-- 検索バー -->
      <div id="search-box" class="hidden flex gap-2 shadow-lg rounded-xl overflow-hidden bg-white border border-slate-100 transition-all relative z-[1001]">
        <input type="text" id="search-input" placeholder="地名や施設を検索..." class="flex-1 p-3 text-sm outline-none w-full">
        <button id="btn-search" class="bg-blue-600 text-white w-14 flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 shrink-0"><i class="fas fa-search"></i></button>
      </div>
    </div>

    <!-- 右下ボタン群 -->
    <div class="p-4 flex flex-col items-end gap-3 pointer-events-auto pb-4 w-full box-border">
      <button id="btn-home" class="bg-white text-slate-600 w-12 h-12 rounded-full shadow-lg border border-slate-200 flex items-center justify-center text-xl active:scale-90 transition"><i class="fas fa-house"></i></button>
      <button id="btn-gps" class="bg-white text-slate-600 w-12 h-12 rounded-full shadow-lg border border-slate-200 flex items-center justify-center text-xl active:scale-90 transition"><i class="fas fa-location-crosshairs"></i></button>
    </div>
  </div>

  <!-- タイムラインパネル (全画面タブ表示用) -->
  <div id="timeline-panel" class="flex flex-col timeline-hidden border-t border-slate-200">
    <div class="p-4 bg-white shadow-sm z-10 shrink-0">
      <h2 class="font-bold text-blue-900 text-lg mb-3"><i class="fas fa-route text-blue-500 mr-2"></i>旅のしおり＆思い出</h2>
      <div class="flex gap-2 overflow-x-auto hide-scrollbar" id="tab-container">
        <button class="tab-btn flex-1 bg-blue-600 text-white rounded-lg py-2 text-xs font-bold shrink-0" data-day="11/30">Day1 (11/30)</button>
        <button class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-2 text-xs font-bold shrink-0" data-day="12/01">Day2 (12/1)</button>
        <button class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-2 text-xs font-bold shrink-0" data-day="12/02">Day3 (12/2)</button>
        <button class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-2 text-xs font-bold shrink-0" data-day="12/03">Day4 (12/3)</button>
      </div>
    </div>
    <div id="timeline-content" class="p-4 overflow-y-auto flex-1 space-y-3 pb-8 scroll-smooth"></div>
  </div>

  <!-- ボトムナビゲーション -->
  <div id="bottom-nav" class="bg-white shadow-[0_-2px_15px_rgba(0,0,0,0.05)] border-t border-slate-100 flex pointer-events-auto">
    <button id="nav-map" class="flex-1 py-3 flex flex-col items-center gap-1 text-blue-600 transition active:bg-blue-50">
      <i class="fas fa-map-marked-alt text-xl"></i>
      <span class="text-[10px] font-bold">マップ</span>
    </button>
    <button id="nav-timeline" class="flex-1 py-3 flex flex-col items-center gap-1 text-slate-400 transition active:bg-blue-50">
      <i class="fas fa-list-ul text-xl"></i>
      <span class="text-[10px] font-bold">タイムライン</span>
    </button>
  </div>

  <!-- ピン追加モーダル -->
  <div id="pin-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[3000] p-4 backdrop-blur-sm overflow-y-auto">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl my-auto">
      <div class="bg-blue-600 text-white p-3 font-bold text-center flex items-center justify-center gap-2 rounded-t-2xl">
        <i class="fas fa-pen-nib"></i> 記録を追加
      </div>
      <div class="p-4 space-y-4 max-h-[70vh] overflow-y-auto">
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block text-[10px] font-bold text-slate-500 mb-1">日付</label>
            <select id="input-day" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm">
              <option value="11/30">11/30 (Day1)</option><option value="12/01">12/1 (Day2)</option><option value="12/02">12/2 (Day3)</option><option value="12/03">12/3 (Day4)</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block text-[10px] font-bold text-slate-500 mb-1">時間</label>
            <input type="time" id="input-time" value="12:00" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 mb-1">誰の記録？</label>
          <select id="input-member" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm">
            <option value="ありねこ">🐈 ありねこ</option><option value="ことみねこ">🐈‍⬛ ことみねこ</option><option value="あつき">🚲 あつき</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 mb-1">内容 / スポット名 <span class="text-red-500">*</span></label>
          <input type="text" id="input-memo" placeholder="例: 尾道ラーメン食べる！" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 mb-1"><i class="fas fa-camera"></i> 写真を添付</label>
          <input type="file" id="input-photo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          <img id="photo-preview" class="mt-2 hidden rounded-lg max-h-32 object-cover w-full border border-slate-200">
        </div>
        <div class="bg-orange-50 p-3 rounded-lg border border-orange-100">
          <label class="block text-[10px] font-bold text-orange-700 mb-2"><i class="fas fa-utensils"></i> グルメカウンターを進める</label>
          <div class="flex gap-2">
            <select id="input-food-type" class="flex-1 bg-white border border-orange-200 rounded-lg p-2 text-sm text-slate-700">
              <option value="">-- 食べたら選択 --</option><option value="okonomi">🥞 お好み焼き</option><option value="oyster">🦪 牡蠣</option><option value="momiji">🍁 もみじ饅頭</option><option value="ramen">🍜 尾道ラーメン</option><option value="lemon">🍋 広島レモン</option>
            </select>
            <select id="input-food-count" class="w-16 bg-white border border-orange-200 rounded-lg p-2 text-sm text-center">
              <option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
            </select>
          </div>
        </div>
      </div>
      <div class="flex gap-3 p-4 bg-slate-50 rounded-b-2xl border-t border-slate-200">
        <button id="btn-cancel" class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold active:scale-95 transition">やめる</button>
        <button id="btn-save" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md shadow-blue-200 active:scale-95 transition">保存する</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7DjN_QqUtMRhQNjWLg6aam2KUqh0CeV0",
      authDomain: "shimanaminyan-c30e6.firebaseapp.com",
      projectId: "shimanaminyan-c30e6",
      storageBucket: "shimanaminyan-c30e6.firebasestorage.app",
      messagingSenderId: "289054186302",
      appId: "1:289054186302:web:b9dc73ed18fe290cafea6f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const pinsCollection = collection(db, "pins");
    const q = query(pinsCollection, orderBy("sortTime", "asc"));

    let allPinsData = []; let currentDayTab = "11/30"; let currentUser = "ありねこ";

    // スプラッシュ画面のプレイヤー選択
    document.querySelectorAll('.player-select-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentUser = e.currentTarget.dataset.player;
        document.getElementById('input-member').value = currentUser; 
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; }, 500);
        showToast(`${currentUser} として参加しました`, "success");
      });
    });

    function showToast(msg, type='info') {
      const container = document.getElementById('toast-container');
      const t = document.createElement('div');
      const colors = { success:'bg-emerald-600', error:'bg-red-500', info:'bg-slate-800' };
      t.className = `flex items-center gap-2 px-4 py-3 rounded-full shadow-lg font-bold text-sm text-white toast-enter ${colors[type]}`;
      t.innerHTML = `<span>${msg}</span>`;
      container.appendChild(t);
      setTimeout(() => { t.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => t.remove(), 300); }, 3000);
    }

    // 地図の初期化
    const map = L.map('map', { zoomControl: false, tap: false });
    const defaultBounds = L.latLngBounds([34.00, 132.30], [34.45, 133.30]);
    map.fitBounds(defaultBounds);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    document.getElementById('btn-home').addEventListener('click', () => { 
      map.fitBounds(defaultBounds, { duration: 1.0 }); 
      showToast("全体マップに戻りました", "info"); 
    });

    let userLocMarker = null; let watchId = null;
    document.getElementById('btn-gps').addEventListener('click', () => {
      if(watchId) { map.stopLocate(); watchId=null; showToast("GPS停止", "info"); }
      else { map.locate({ setView: true, maxZoom: 16, watch: true }); watchId=true; showToast("現在地取得中...", "info"); }
    });
    map.on('locationfound', (e) => {
      if(!userLocMarker) userLocMarker = L.marker(e.latlng, { icon: L.divIcon({ html: `<div class="w-5 h-5 bg-blue-500 rounded-full border-4 border-white shadow-md"></div>`})}).addTo(map);
      else userLocMarker.setLatLng(e.latlng);
    });
    
    document.getElementById('btn-search-toggle').addEventListener('click', () => document.getElementById('search-box').classList.toggle('hidden'));
    document.getElementById('btn-search').addEventListener('click', async () => {
      const v = document.getElementById('search-input').value;
      if(!v) return;
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(v)}`);
        const d = await r.json();
        if(d.length > 0) map.flyTo([d[0].lat, d[0].lon], 15);
      } catch(e) { showToast("検索エラー", "error"); }
    });

    // 写真プレビュー処理
    let currentPhotoBase64 = null;
    document.getElementById('input-photo').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 500;
          canvas.width = MAX_WIDTH; canvas.height = img.height * (MAX_WIDTH / img.width);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('photo-preview').src = currentPhotoBase64;
          document.getElementById('photo-preview').classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // モーダル制御
    let currentLatLng = null; const modal = document.getElementById('pin-modal');
    map.on('contextmenu', (e) => { currentLatLng = e.latlng; openModal(); });
    let clickTimeout; map.on('click', (e) => { clearTimeout(clickTimeout); clickTimeout = setTimeout(() => { currentLatLng = e.latlng; openModal(); }, 250); });
    map.on('dblclick', () => clearTimeout(clickTimeout));

    function openModal() {
      const now = new Date();
      document.getElementById('input-time').value = String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0');
      document.getElementById('input-member').value = currentUser;
      modal.classList.replace('hidden', 'flex');
      currentPhotoBase64 = null; document.getElementById('input-photo').value = ""; document.getElementById('photo-preview').classList.add('hidden');
      document.getElementById('input-food-type').value = "";
    }
    document.getElementById('btn-cancel').addEventListener('click', () => modal.classList.replace('flex', 'hidden'));

    document.getElementById('btn-save').addEventListener('click', async () => {
      const memo = document.getElementById('input-memo').value.trim();
      if(!memo) return showToast("メモを入力", "error");
      const day = document.getElementById('input-day').value;
      const time = document.getElementById('input-time').value;
      const sortTime = parseInt(day.replace('/','') + time.replace(':','')) * 100;

      document.getElementById('btn-save').disabled = true;
      try {
        await addDoc(pinsCollection, {
          member: document.getElementById('input-member').value, memo: memo,
          lat: currentLatLng.lat, lng: currentLatLng.lng,
          day: day, time: time, sortTime: sortTime, status: 'planned',
          photo: currentPhotoBase64,
          foodType: document.getElementById('input-food-type').value,
          foodCount: parseInt(document.getElementById('input-food-count').value) || 0
        });
        showToast("追加しました", "success");
        modal.classList.replace('flex', 'hidden'); document.getElementById('input-memo').value = '';
      } catch(e) { showToast("エラー", "error"); }
      document.getElementById('btn-save').disabled = false;
    });

    // ボトムナビゲーション (タブ切り替え) 処理
    const navMap = document.getElementById('nav-map');
    const navTimeline = document.getElementById('nav-timeline');
    const panel = document.getElementById('timeline-panel');
    const uiLayer = document.getElementById('ui-layer');

    function switchTab(tab) {
      if (tab === 'map') {
        navMap.classList.replace('text-slate-400', 'text-blue-600');
        navTimeline.classList.replace('text-blue-600', 'text-slate-400');
        panel.classList.replace('timeline-visible', 'timeline-hidden');
        uiLayer.style.display = 'flex'; // マップのUIを表示
      } else {
        navTimeline.classList.replace('text-slate-400', 'text-blue-600');
        navMap.classList.replace('text-blue-600', 'text-slate-400');
        panel.classList.replace('timeline-hidden', 'timeline-visible');
        uiLayer.style.display = 'none'; // タイムライン中はマップUIを隠す
        renderTimeline(true);
      }
    }

    navMap.addEventListener('click', () => switchTab('map'));
    navTimeline.addEventListener('click', () => switchTab('timeline'));

    window.updateStatus = async (id, statusStr) => {
      await updateDoc(doc(db, "pins", id), { status: statusStr });
      if(statusStr !== 'planned') showToast("ステータスを更新しました", "success");
    };

    function updateTabUI() {
      document.querySelectorAll('.tab-btn').forEach(b => {
        if(b.dataset.day === currentDayTab) {
          b.classList.replace('bg-slate-100', 'bg-blue-600'); b.classList.replace('text-slate-500', 'text-white');
        } else {
          b.classList.replace('bg-blue-600', 'bg-slate-100'); b.classList.replace('text-white', 'text-slate-500');
        }
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentDayTab = e.target.dataset.day;
        updateTabUI(); renderTimeline(false);
      });
    });

    window.swapOrder = async (idA, idB) => {
      const pinA = allPinsData.find(p => p.id === idA); const pinB = allPinsData.find(p => p.id === idB);
      if(!pinA || !pinB) return;
      await updateDoc(doc(db, "pins", idA), { sortTime: pinB.sortTime });
      await updateDoc(doc(db, "pins", idB), { sortTime: pinA.sortTime });
    };
    window.deletePin = async (id) => { if(confirm("削除しますか？")) { await deleteDoc(doc(db, "pins", id)); showToast("削除済", "success"); } };

    let markers = [];
    
    onSnapshot(q, (snapshot) => {
      allPinsData = [];
      let foodTotals = { okonomi: 0, oyster: 0, momiji: 0, ramen: 0, lemon: 0 };
      
      snapshot.forEach(d => {
        const data = d.data();
        allPinsData.push({ id: d.id, ...data });
        if(data.foodType && data.status !== 'canceled' && foodTotals[data.foodType] !== undefined) {
          foodTotals[data.foodType] += data.foodCount;
        }
      });

      document.getElementById('cnt-okonomi').innerText = foodTotals.okonomi;
      document.getElementById('cnt-oyster').innerText = foodTotals.oyster;
      document.getElementById('cnt-momiji').innerText = foodTotals.momiji;
      document.getElementById('cnt-ramen').innerText = foodTotals.ramen;
      document.getElementById('cnt-lemon').innerText = foodTotals.lemon;

      let firstUnfinished = allPinsData.find(p => !p.status || p.status === 'planned');
      if(firstUnfinished) {
        currentDayTab = firstUnfinished.day;
      } else if(allPinsData.length > 0) {
        currentDayTab = allPinsData[allPinsData.length - 1].day;
      }
      
      updateTabUI();
      renderTimeline(false);
      renderMap();
    });

    function renderMap() {
      markers.forEach(m => map.removeLayer(m)); markers = [];
      allPinsData.forEach(data => {
        let emoji = "📍";
        if(data.member==="ありねこ") emoji="🐈"; else if(data.member==="ことみねこ") emoji="🐈‍⬛"; else if(data.member==="あつき") emoji="🚲";
        
        let doneClass = (data.status && data.status !== 'planned') ? "done-pin" : "";
        let customHtml = `<div class="custom-pin w-10 h-10 ${doneClass}">${emoji}</div>`;
        if(data.photo) customHtml = `<div class="custom-pin w-12 h-12 overflow-hidden border-4 ${doneClass}"><img src="${data.photo}" class="w-full h-full object-cover"></div>`;

        const icon = L.divIcon({ html: customHtml, className: '', iconSize: [48,48], iconAnchor: [24,48] });
        const m = L.marker([data.lat, data.lng], { icon: icon }).addTo(map).bindPopup(`<b>${data.time} ${data.member}</b><br>${data.memo}`);
        markers.push(m);
      });
    }

    function renderTimeline(autoScroll = false) {
      const content = document.getElementById('timeline-content');
      content.innerHTML = '';
      
      const dayPins = allPinsData.filter(p => p.day === currentDayTab);
      
      if(dayPins.length === 0) {
        content.innerHTML = `<div class="text-center text-slate-400 mt-10"><i class="fas fa-bed text-3xl mb-2"></i><br>この日の予定はまだありません</div>`;
        return;
      }

      let timeCount = {}; 
      
      dayPins.forEach((data, index) => {
        if(!timeCount[data.time]) timeCount[data.time] = 1; else timeCount[data.time]++;
        const badgeNum = timeCount[data.time] > 1 ? ` <span class="bg-blue-600 text-white rounded-full px-1.5 py-0.5 text-[10px] ml-1">①</span>`.replace('①', String.fromCharCode(9311 + timeCount[data.time])) : (timeCount[data.time]===1 && dayPins.filter(p=>p.time===data.time).length > 1 ? ` <span class="bg-blue-600 text-white rounded-full px-1.5 py-0.5 text-[10px] ml-1">①</span>` : '');

        let emoji = "📍"; let color = "text-blue-800";
        if(data.member==="ありねこ") { emoji="🐈"; color="text-orange-600"; }
        if(data.member==="ことみねこ") { emoji="🐈‍⬛"; color="text-purple-600"; }
        if(data.member==="あつき") { emoji="🚲"; color="text-emerald-600"; }

        const prevId = index > 0 ? dayPins[index-1].id : null;
        const nextId = index < dayPins.length - 1 ? dayPins[index+1].id : null;

        const isDone = data.status && data.status !== 'planned';
        const cardClass = isDone ? "item-done" : "item-active";

        const card = document.createElement('div');
        card.className = `flex gap-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-100 group mb-3 ${cardClass}`;
        if(!isDone) card.dataset.active = "true";
        
        let controls = `<div class="flex flex-col items-center justify-center shrink-0 w-12 border-r border-slate-100 pr-2">`;
        if(prevId) controls += `<button onclick="swapOrder('${data.id}', '${prevId}')" class="text-slate-300 hover:text-blue-500 active:scale-110 pb-1"><i class="fas fa-chevron-up"></i></button>`;
        controls += `<div class="font-bold text-slate-700 text-sm my-1">${data.time}</div>`;
        if(nextId) controls += `<button onclick="swapOrder('${data.id}', '${nextId}')" class="text-slate-300 hover:text-blue-500 active:scale-110 pt-1"><i class="fas fa-chevron-down"></i></button>`;
        controls += `</div>`;

        let photoHtml = data.photo ? `<img src="${data.photo}" class="mt-2 rounded-lg max-h-32 object-cover w-full border border-slate-200">` : "";
        let foodHtml = data.foodType ? `<div class="mt-2 text-[10px] font-bold text-orange-600 bg-orange-50 inline-block px-2 py-1 rounded-full"><i class="fas fa-utensils"></i> グルメ +${data.foodCount}</div>` : "";

        let actionButtons = '';
        if(!isDone) {
          actionButtons = `
            <div class="flex gap-2 mt-3">
              <button onclick="updateStatus('${data.id}', 'visited')" class="flex-1 bg-emerald-50 text-emerald-600 py-1.5 rounded-lg text-xs font-bold border border-emerald-200 active:scale-95">✅ 行った</button>
              <button onclick="updateStatus('${data.id}', 'rated')" class="flex-1 bg-yellow-50 text-yellow-600 py-1.5 rounded-lg text-xs font-bold border border-yellow-200 active:scale-95">⭐️ 評価</button>
              <button onclick="updateStatus('${data.id}', 'canceled')" class="flex-1 bg-slate-50 text-slate-500 py-1.5 rounded-lg text-xs font-bold border border-slate-200 active:scale-95">❌ 中止</button>
            </div>
          `;
        } else {
          let label = "完了";
          if(data.status === 'visited') label = "✅ 行った済";
          if(data.status === 'rated') label = "⭐️ 最高でした！";
          if(data.status === 'canceled') label = "❌ キャンセル済";
          actionButtons = `
            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-100">
              <span class="text-xs font-bold text-slate-500">${label}</span>
              <button onclick="updateStatus('${data.id}', 'planned')" class="text-xs text-blue-500 underline py-1 px-2">戻す</button>
            </div>
          `;
        }

        card.innerHTML = `
          ${controls}
          <div class="flex-1 min-w-0 py-1">
            <div class="flex justify-between items-start">
              <span class="font-bold text-xs ${color} bg-slate-50 px-2 py-0.5 rounded-md">${emoji} ${data.member}</span>
              <button onclick="deletePin('${data.id}')" class="text-slate-300 hover:text-red-500 text-sm p-1"><i class="fas fa-trash"></i></button>
            </div>
            <div class="text-sm font-bold text-slate-800 mt-1.5 break-words">${data.memo}${badgeNum}</div>
            ${foodHtml}
            ${photoHtml}
            ${actionButtons}
          </div>
        `;
        
        card.addEventListener('click', (e) => {
          if(e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
            switchTab('map'); // タブをマップに切り替えて移動
            map.flyTo([data.lat, data.lng], 16, {duration:0.5});
          }
        });

        content.appendChild(card);
      });

      if(autoScroll) {
        setTimeout(() => {
          const firstActive = document.querySelector('[data-active="true"]');
          if(firstActive) {
            firstActive.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      }
    }
  </script>
</body>
</html>
