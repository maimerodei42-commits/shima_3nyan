<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>しまねこトリオ 🐾 記憶のジオラマ</title>

<!-- Web App Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="しまねこトリオ">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background-color: #f0f8ff;
    margin: 0; padding: 0; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); width: 100%; z-index: 1; }
  #ui-layer { position: absolute; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); z-index: 1000; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding-top: var(--sat); }
  .pointer-events-auto { pointer-events: auto; }
  .pale-map-tiles { filter: brightness(1.02) contrast(0.98); }

  #timeline-panel { position: fixed; top: 0; left: 0; right: 0; bottom: calc(56px + var(--sab)); z-index: 1500; background-color: #f8fafc; padding-top: var(--sat); transition: opacity 0.2s ease, visibility 0.2s ease; }
  .timeline-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .timeline-visible { opacity: 1; visibility: visible; pointer-events: auto; }
  #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; padding-bottom: var(--sab); }

  /* ピンのスタイル */
  .custom-pin { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: white; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.25); border: 2px solid white; }
  /* 「行った」ピンはピンクに */
  .pin-done { background-color: #f472b6 !important; border-color: #fbcfe8 !important; opacity: 0.9; } 
  .pin-cancel { background-color: #cbd5e1 !important; opacity: 0.4; text-decoration: line-through; }
  
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  .toast-enter { animation: slideDown 0.3s ease-out forwards; }
  .toast-exit { animation: slideUp 0.3s ease-in forwards; }
  @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }

  /* 検索結果リスト用 */
  #searchResults { max-height: 200px; overflow-y: auto; }
</style>
</head>
<body class="text-slate-700 min-h-screen flex flex-col select-none">

<div id="toast-container" class="fixed top-0 left-0 right-0 z-[5000] flex flex-col items-center pt-[calc(env(safe-area-inset-top,0px)+10px)] pointer-events-none gap-2 px-4"></div>

<!-- メンバー選択 -->
<div id="splashScreen" class="fixed inset-0 z-[9999] bg-gradient-to-b from-slate-100 via-sky-50 to-blue-100 flex flex-col items-center justify-center p-6 text-center">
  <div id="splashTitle" class="space-y-4 animate-fade-in">
    <div class="inline-block bg-white/80 backdrop-blur-md px-6 py-4 rounded-3xl shadow-xl">
      <p class="text-xs text-sky-400 font-bold mb-1">記憶のジオラマ</p>
      <h1 class="text-3xl font-extrabold text-sky-600 tracking-wider">しまねこトリオ 🐾</h1>
    </div>
  </div>
  <div id="userSelectBox" class="hidden space-y-5 animate-fade-in max-w-xs w-full bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl mt-4">
    <h2 class="text-lg font-bold text-slate-700 border-b border-sky-100 pb-2">あなたはだれ？</h2>
    <div class="flex flex-col gap-3">
      <button onclick="selectUser('ありねこ')" class="w-full py-3 bg-rose-400 text-white font-bold rounded-2xl shadow-md">🐱 ありねこ</button>
      <button onclick="selectUser('ことみねこ')" class="w-full py-3 bg-teal-400 text-white font-bold rounded-2xl shadow-md">🐱 ことみねこ</button>
      <button onclick="selectUser('クロスバイカーあつき')" class="w-full py-3 bg-indigo-500 text-white font-bold rounded-2xl shadow-md">🚴‍♂️ クロスバイカーあつき</button>
    </div>
  </div>
</div>

<div id="map"></div>

<div id="ui-layer">
  <div class="p-3 space-y-2 pointer-events-auto w-full box-border">
    <header class="bg-white/90 backdrop-blur-md shadow-sm rounded-2xl px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h1 class="text-sm font-extrabold text-sky-600 m-0">しまねこトリオ 🐾</h1>
        <span id="currentUserBadge" class="text-[10px] bg-sky-100 text-sky-700 font-bold px-2 py-0.5 rounded-full">未選択</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleSearch()" class="w-8 h-8 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center shadow-sm">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <button onclick="openAddModal()" class="bg-sky-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm flex items-center gap-1">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>予定追加
        </button>
      </div>
    </header>

    <!-- グルメカウンター -->
    <div class="bg-white/90 backdrop-blur shadow-sm rounded-xl p-2 flex gap-3 overflow-x-auto hide-scrollbar border border-orange-100">
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🥞</span><span class="text-xs font-bold text-slate-600">お好み焼き</span><span id="cnt-okonomi" class="font-bold text-orange-500 ml-1">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🦪</span><span class="text-xs font-bold text-slate-600">牡蠣</span><span id="cnt-oyster" class="font-bold text-orange-500 ml-1">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🍁</span><span class="text-xs font-bold text-slate-600">もみじ</span><span id="cnt-momiji" class="font-bold text-orange-500 ml-1">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🍜</span><span class="text-xs font-bold text-slate-600">ラーメン</span><span id="cnt-ramen" class="font-bold text-orange-500 ml-1">0</span></div>
      <div class="flex items-center gap-1 shrink-0"><span class="text-lg">🍋</span><span class="text-xs font-bold text-slate-600">レモン</span><span id="cnt-lemon" class="font-bold text-orange-500 ml-1">0</span></div>
    </div>

    <!-- 検索ボックス -->
    <div id="searchContainer" class="hidden flex flex-col gap-1 shadow-lg rounded-xl overflow-hidden bg-white border border-sky-100">
      <div class="flex">
        <input type="text" id="searchInput" placeholder="地名や施設を検索..." class="flex-1 p-2.5 text-xs outline-none">
        <button onclick="executeSearch()" class="bg-sky-500 text-white px-4 flex items-center justify-center"><i data-lucide="search" class="w-4 h-4"></i></button>
      </div>
      <!-- 検索結果リスト -->
      <ul id="searchResults" class="text-xs divide-y divide-slate-100 bg-white"></ul>
    </div>
  </div>

  <div class="p-4 flex flex-col items-end gap-3 pointer-events-auto pb-4 w-full box-border">
    <button onclick="resetToDefaultBounds()" class="bg-white/95 p-3 rounded-full shadow-lg text-slate-600"><i data-lucide="home" class="w-5 h-5"></i></button>
    <button onclick="locateUser()" class="bg-white/95 p-3 rounded-full shadow-lg text-sky-600"><i data-lucide="locate-fixed" class="w-5 h-5"></i></button>
  </div>
</div>

<!-- タイムラインパネル -->
<div id="timeline-panel" class="flex flex-col timeline-hidden border-t border-slate-200">
  <div class="p-4 bg-white shadow-sm z-10 shrink-0">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h2 class="font-bold text-sky-700 text-base m-0 flex items-center gap-1.5"><i data-lucide="route" class="w-5 h-5"></i>📍 旅のみちのり順</h2>
      </div>
    </div>
    <div class="flex gap-2 overflow-x-auto hide-scrollbar" id="tabContainer">
      <button onclick="filterDay('11/30')" class="tab-btn flex-1 bg-sky-500 text-white rounded-lg py-1.5 text-xs font-bold" data-day="11/30">11/30</button>
      <button onclick="filterDay('12/01')" class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold" data-day="12/01">12/01</button>
      <button onclick="filterDay('12/02')" class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold" data-day="12/02">12/02</button>
      <button onclick="filterDay('12/03')" class="tab-btn flex-1 bg-slate-100 text-slate-500 rounded-lg py-1.5 text-xs font-bold" data-day="12/03">12/03</button>
    </div>
  </div>
  <div id="routeTimelineList" class="p-4 overflow-y-auto flex-1 space-y-3 pb-8"></div>
</div>

<nav id="bottom-nav" class="bg-white shadow border-t border-sky-100 flex pointer-events-auto">
  <button onclick="switchMainTab('map')" id="navBtnMap" class="flex-1 py-2.5 flex flex-col items-center gap-0.5 text-sky-600 font-bold text-xs"><i data-lucide="map" class="w-5 h-5"></i>マップ</button>
  <button onclick="switchMainTab('route')" id="navBtnRoute" class="flex-1 py-2.5 flex flex-col items-center gap-0.5 text-slate-400 font-bold text-xs"><i data-lucide="route" class="w-5 h-5"></i>みちのり</button>
</nav>

<!-- 追加/編集 モーダル -->
<div id="spotModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[3000] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-5 relative max-h-[85vh] overflow-y-auto border border-sky-100">
    <button type="button" onclick="closeAddModal()" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
    <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="map-pin" class="w-5 h-5 text-sky-500"></i>場所を追加</h3>
    
    <form id="spotForm" onsubmit="saveSpot(event)" class="space-y-3 text-xs">
      <input type="hidden" id="spotLat"><input type="hidden" id="spotLng">

      <div>
        <label class="block font-bold text-slate-600 mb-1">スポット名 <span class="text-rose-500">*</span></label>
        <input type="text" id="spotName" required class="w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-bold text-slate-600 mb-1">ジャンル</label>
          <select id="spotGenre" onchange="autoSetEmoji()" class="w-full border rounded-xl p-2.5 bg-white">
            <option value="sightseeing">🚴 観光・遊び</option>
            <option value="gourmet">🦪 グルメ・ご飯</option>
            <option value="hotel">🏨 宿・休憩</option>
            <option value="other">📍 その他</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">ピンの絵文字</label>
          <input type="text" id="spotEmoji" value="🚴" class="w-full border rounded-xl p-2.5 text-center text-lg outline-none focus:ring-2 focus:ring-sky-400">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div><label class="block font-bold text-slate-600 mb-1">日付</label><select id="spotDate" required class="w-full border rounded-xl p-2.5 bg-white"><option value="11/30">11/30</option><option value="12/01">12/01</option><option value="12/02">12/02</option><option value="12/03">12/03</option></select></div>
        <div><label class="block font-bold text-slate-600 mb-1">時間</label><select id="spotTime" required class="w-full border rounded-xl p-2.5 bg-white"></select></div>
      </div>

      <div id="urlContainer" class="space-y-2">
        <label class="block font-bold text-slate-600 mb-1">参考URL (入力すると追加枠が出ます)</label>
        <input type="url" class="spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400" placeholder="https://..." oninput="checkAndAddUrlInput()">
      </div>

      <div>
        <label class="block font-bold text-slate-600 mb-1">優先度</label>
        <select id="spotPriority" class="w-full border rounded-xl p-2.5 bg-white">
          <option value="reserved">✅ 予約済み</option>
          <option value="3">★★★ (絶対行きたい)</option>
          <option value="2">★★☆ (行けたら行く)</option>
          <option value="1">★☆☆ (時間あれば)</option>
        </select>
      </div>

      <div class="pt-2 flex gap-2">
        <button type="button" onclick="closeAddModal()" class="w-1/3 py-2.5 rounded-xl border text-slate-600">キャンセル</button>
        <button type="submit" id="btnSaveSpot" class="w-2/3 py-2.5 rounded-xl bg-sky-500 text-white font-bold">保存する</button>
      </div>
    </form>
  </div>
</div>

<!-- 評価＆カウンター モーダル -->
<div id="evalModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[3000] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl max-w-xs w-full p-5 relative">
    <h3 class="text-base font-bold text-slate-800 mb-3 text-center">⭐ 思い出とグルメ記録</h3>
    <form onsubmit="submitEvaluation(event)" class="space-y-3 text-xs">
      <input type="hidden" id="evalSpotId">
      
      <!-- グルメ記録をここに移動 -->
      <div class="bg-orange-50 p-3 rounded-xl border border-orange-100">
        <label class="block font-bold text-orange-700 mb-2">🥞 食べたものを記録</label>
        <div class="flex gap-2">
          <select id="evalFoodType" class="flex-1 border border-orange-200 rounded-lg p-2 bg-white text-slate-700">
            <option value="">-- 食べなかった --</option>
            <option value="okonomi">🥞 お好み焼き</option>
            <option value="oyster">🦪 牡蠣</option>
            <option value="momiji">🍁 もみじ饅頭</option>
            <option value="ramen">🍜 尾道ラーメン</option>
            <option value="lemon">🍋 広島レモン</option>
          </select>
          <select id="evalFoodCount" class="w-16 border border-orange-200 rounded-lg p-2 bg-white text-center">
            <option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-600 mb-1">評価</label>
        <select id="evalRating" class="w-full border rounded-xl p-2 bg-white">
          <option value="5">★★★★★ 最高だった！</option><option value="4">★★★★☆ 良かった</option><option value="3">★★★☆☆ 普通</option><option value="2">★★☆☆☆ イマイチ</option><option value="1">★☆☆☆☆ 残念</option>
        </select>
      </div>
      <div>
        <label class="block font-bold text-slate-600 mb-1">感想</label>
        <textarea id="evalComment" rows="2" class="w-full border rounded-xl p-2"></textarea>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeEvalModal()" class="w-1/2 py-2 rounded-xl border">閉じる</button>
        <button type="submit" class="w-1/2 py-2 rounded-xl bg-sky-500 text-white font-bold">記録する</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7DjN_QqUtMRhQNjWLg6aam2KUqh0CeV0",
    authDomain: "shimanaminyan-c30e6.firebaseapp.com",
    projectId: "shimanaminyan-c30e6"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const pinsCollection = collection(db, "pins");
  const q = query(pinsCollection, orderBy("sortTime", "asc"));

  window.currentUser = ""; window.map = null; window.markers = []; window.spots = []; window.currentDayTab = "11/30";

  window.onload = function() {
    lucide.createIcons();
    const timeSelect = document.getElementById('spotTime');
    for(let i=0; i<24; i++) timeSelect.appendChild(new Option(`${String(i).padStart(2,'0')}:00`, `${String(i).padStart(2,'0')}:00`));
    setTimeout(() => { document.getElementById('splashTitle').classList.add('hidden'); document.getElementById('userSelectBox').classList.remove('hidden'); }, 1500);
  };

  window.selectUser = function(name) { window.currentUser = name; document.getElementById('currentUserBadge').textContent = name; document.getElementById('splashScreen').classList.add('hidden'); initMap(); };

  function initMap() {
    window.map = L.map('map', { zoomControl: false, tap: false }).setView([34.25, 133.00], 10);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { maxZoom: 18, className: 'pale-map-tiles' }).addTo(window.map);
    window.map.on('click', e => openAddModal(e.latlng.lat, e.latlng.lng));

    onSnapshot(q, (snapshot) => {
      window.spots = [];
      let foodTotals = { okonomi:0, oyster:0, momiji:0, ramen:0, lemon:0 };
      snapshot.forEach(d => {
        const data = d.data();
        window.spots.push({ id: d.id, ...data });
        if(data.foodType && data.status !== 'cancel' && data.rating) foodTotals[data.foodType] += (data.foodCount || 1);
      });
      ['okonomi','oyster','momiji','ramen','lemon'].forEach(k => document.getElementById(`cnt-${k}`).innerText = foodTotals[k]);
      renderMarkers(); renderRouteTimeline();
    });
  }

  /* --- 検索処理 --- */
  window.toggleSearch = function() { document.getElementById('searchContainer').classList.toggle('hidden'); };
  window.executeSearch = async function() {
    const val = document.getElementById('searchInput').value.trim();
    if(!val) return;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}`);
    const data = await res.json();
    const ul = document.getElementById('searchResults'); ul.innerHTML = "";
    if(data.length > 0) {
      data.slice(0, 5).forEach(item => {
        const li = document.createElement('li');
        li.className = "p-3 hover:bg-sky-50 cursor-pointer flex justify-between items-center";
        li.innerHTML = `<span>${item.display_name.split(',')[0]}</span><span class="text-[10px] bg-sky-100 text-sky-600 px-2 py-1 rounded">ピンを打つ</span>`;
        li.onclick = () => {
          window.map.flyTo([item.lat, item.lon], 16);
          document.getElementById('searchContainer').classList.add('hidden');
          openAddModal(item.lat, item.lon, item.display_name.split(',')[0]);
        };
        ul.appendChild(li);
      });
    } else { ul.innerHTML = "<li class='p-3 text-slate-400'>見つかりませんでした</li>"; }
  };

  /* --- UI制御 --- */
  window.switchMainTab = function(tab) {
    if(tab === 'map') { document.getElementById('timeline-panel').classList.replace('timeline-visible','timeline-hidden'); document.getElementById('ui-layer').style.display='flex'; }
    else { document.getElementById('timeline-panel').classList.replace('timeline-hidden','timeline-visible'); document.getElementById('ui-layer').style.display='none'; renderRouteTimeline(); }
  };
  window.filterDay = function(day) { window.currentDayTab = day; renderRouteTimeline(); };

  /* --- ピンとタイムライン描画 --- */
  function renderMarkers() {
    window.markers.forEach(m => window.map.removeLayer(m)); window.markers = [];
    window.spots.forEach(spot => {
      let ext = spot.status === 'done' ? "pin-done" : (spot.status === 'cancel' ? "pin-cancel" : "");
      let iconHtml = `<div class="custom-pin ${ext}" style="background-color:#38bdf8; width:32px; height:32px; font-size:16px;">${spot.iconEmoji || '📍'}</div>`;
      let marker = L.marker([spot.lat, spot.lng], { icon: L.divIcon({ html: iconHtml, className: '', iconSize: [32,32], iconAnchor:[16,32] }) }).addTo(window.map);
      marker.bindPopup(`<div class="font-bold text-xs text-center">${spot.name}</div>`);
      window.markers.push(marker);
    });
  }

  function renderRouteTimeline() {
    const list = document.getElementById('routeTimelineList');
    const daySpots = window.spots.filter(s => s.date === window.currentDayTab);
    list.innerHTML = daySpots.map(spot => {
      const isDone = spot.status === 'done';
      let prioText = spot.priority === 'reserved' ? '✅ 予約済み' : ('★'.repeat(spot.priority||1) + '☆'.repeat(3-(spot.priority||1)));
      let urlsHtml = (spot.urls || []).filter(u=>u).map(u => `<a href="${u}" target="_blank" class="text-sky-500 hover:underline inline-flex items-center gap-1 mt-1 break-all bg-sky-50 px-2 py-1 rounded-md w-full"><i data-lucide="external-link" class="w-3 h-3"></i>URLをひらく(Safari等)</a>`).join('');
      
      return `
      <div class="p-3 bg-white rounded-2xl shadow-sm border border-slate-200 space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span class="font-extrabold bg-sky-100 text-sky-700 px-2 py-1 rounded-full">${spot.time}</span>
          <span class="${spot.priority==='reserved'?'text-rose-500':'text-amber-400'} font-bold">${prioText}</span>
        </div>
        <div>
          <h3 class="font-bold text-sm ${spot.status==='cancel'?'line-through text-slate-400':''}">${spot.iconEmoji||'📍'} ${spot.name}</h3>
          <div class="flex flex-col gap-1 mt-1 text-[10px]">${urlsHtml}</div>
        </div>
        ${spot.rating ? `<div class="text-xs text-pink-700 bg-pink-50 p-2 rounded-xl font-bold">⭐ 評価済 (グルメ記録含む)</div>` : ''}
        <div class="pt-2 flex justify-end gap-2 text-xs">
          <button onclick="openEvalModal('${spot.id}')" class="px-3 py-1.5 rounded-xl bg-pink-50 text-pink-600 font-bold border border-pink-100">評価・グルメ記録</button>
          <button onclick="updateStatus('${spot.id}', 'done')" class="px-3 py-1.5 rounded-xl ${isDone?'bg-pink-400 text-white':'bg-slate-100'} font-bold">✓ 行った</button>
        </div>
      </div>`;
    }).join('') || '<div class="text-center py-10 text-xs text-slate-400">予定がありません</div>';
    lucide.createIcons();
  }

  window.updateStatus = async function(id, st) {
    const spot = window.spots.find(s=>s.id===id);
    await updateDoc(doc(db, "pins", id), { status: spot.status===st ? 'pending' : st });
  };

  /* --- モーダル・入力制御 --- */
  window.autoSetEmoji = function() {
    const emojis = { sightseeing:'🚴', gourmet:'🦪', hotel:'🏨', other:'📍' };
    document.getElementById('spotEmoji').value = emojis[document.getElementById('spotGenre').value] || '📍';
  };

  window.checkAndAddUrlInput = function() {
    const inputs = document.querySelectorAll('.spotUrlInput');
    const lastInput = inputs[inputs.length - 1];
    if(lastInput.value.trim() !== "") {
      const newInput = document.createElement('input');
      newInput.type = "url"; newInput.className = "spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400 mt-2";
      newInput.placeholder = "追加のURL..."; newInput.oninput = window.checkAndAddUrlInput;
      document.getElementById('urlContainer').appendChild(newInput);
    }
  };

  window.openAddModal = function(lat, lng, name="") {
    document.getElementById('spotForm').reset();
    document.getElementById('urlContainer').innerHTML = `<label class="block font-bold text-slate-600 mb-1">参考URL</label><input type="url" class="spotUrlInput w-full border rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-sky-400" placeholder="https://..." oninput="checkAndAddUrlInput()">`;
    document.getElementById('spotLat').value = lat; document.getElementById('spotLng').value = lng;
    document.getElementById('spotName').value = name;
    document.getElementById('spotModal').classList.remove('hidden');
    window.autoSetEmoji();
  };
  window.closeAddModal = () => document.getElementById('spotModal').classList.add('hidden');

  window.saveSpot = async function(e) {
    e.preventDefault();
    const urls = Array.from(document.querySelectorAll('.spotUrlInput')).map(i=>i.value.trim()).filter(v=>v!=="");
    await addDoc(pinsCollection, {
      name: document.getElementById('spotName').value,
      date: document.getElementById('spotDate').value,
      time: document.getElementById('spotTime').value,
      sortTime: parseInt(document.getElementById('spotDate').value.replace('/','') + document.getElementById('spotTime').value.replace(':','')) * 100,
      priority: document.getElementById('spotPriority').value,
      iconEmoji: document.getElementById('spotEmoji').value,
      urls: urls,
      lat: parseFloat(document.getElementById('spotLat').value),
      lng: parseFloat(document.getElementById('spotLng').value),
      status: 'pending'
    });
    closeAddModal();
  };

  window.openEvalModal = function(id) {
    document.getElementById('evalSpotId').value = id;
    document.getElementById('evalModal').classList.remove('hidden');
  };
  window.closeEvalModal = () => document.getElementById('evalModal').classList.add('hidden');

  window.submitEvaluation = async function(e) {
    e.preventDefault();
    const id = document.getElementById('evalSpotId').value;
    await updateDoc(doc(db, "pins", id), {
      rating: document.getElementById('evalRating').value,
      evalComment: document.getElementById('evalComment').value,
      foodType: document.getElementById('evalFoodType').value,
      foodCount: parseInt(document.getElementById('evalFoodCount').value) || 1,
      status: 'done' // 評価したら自動で「行った（ピンク）」にする
    });
    closeEvalModal();
  };
</script>
</body>
</html>
